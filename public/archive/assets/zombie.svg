<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Zombie body -->
  <rect x="4" y="4" width="12" height="12" rx="2" fill="#3B8A30"/>
  <!-- Dark shadow -->
  <rect x="4" y="4" width="12" height="3" rx="2" fill="#2D6A25"/>
  <rect x="4" y="13" width="12" height="3" rx="2" fill="#2D6A25"/>
  <!-- Ragged edges -->
  <rect x="3" y="8" width="2" height="3" fill="#3B8A30" opacity="0.7"/>
  <rect x="15" y="9" width="2" height="3" fill="#3B8A30" opacity="0.7"/>
  <!-- Highlight -->
  <rect x="6" y="6" width="8" height="4" rx="1" fill="#5AA84F" opacity="0.5"/>
  <!-- Eyes -->
  <circle cx="8" cy="8" r="1.5" fill="#FF4444"/>
  <circle cx="12" cy="8" r="1.5" fill="#FF4444"/>
  <!-- Mouth -->
  <rect x="7" y="11" width="6" height="1.5" rx="0.5" fill="#1A3A15"/>
  <!-- Reaching arms -->
  <rect x="2" y="6" width="3" height="5" rx="1" fill="#2D6A25"/>
  <rect x="15" y="6" width="3" height="5" rx="1" fill="#2D6A25"/>
</svg>
