<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Shadow -->
  <ellipse cx="12" cy="22" rx="7" ry="1.5" fill="#000" opacity="0.3"/>
  <!-- Body (hunched, emaciated) -->
  <path d="M6 10 Q4 14 5 18 L19 18 Q20 14 18 10 Z" fill="#5A4A5A"/>
  <!-- Ribcage visible -->
  <path d="M8 12 L8 16" fill="none" stroke="#3A2A3A" stroke-width="0.8"/>
  <path d="M10 11 L10 17" fill="none" stroke="#3A2A3A" stroke-width="0.8"/>
  <path d="M12 11 L12 17" fill="none" stroke="#3A2A3A" stroke-width="0.8"/>
  <path d="M14 11 L14 17" fill="none" stroke="#3A2A3A" stroke-width="0.8"/>
  <path d="M16 12 L16 16" fill="none" stroke="#3A2A3A" stroke-width="0.8"/>
  <!-- Head (skull-like) -->
  <ellipse cx="12" cy="7" rx="5" ry="5" fill="#6A5A6A"/>
  <!-- Skull features -->
  <ellipse cx="12" cy="5" rx="4" ry="3" fill="#7A6A7A"/>
  <!-- Eye sockets (deep) -->
  <ellipse cx="10" cy="6" rx="2" ry="1.8" fill="#1A0A1A"/>
  <ellipse cx="14" cy="6" rx="2" ry="1.8" fill="#1A0A1A"/>
  <!-- Glowing eyes -->
  <circle cx="10" cy="6" r="1" fill="#CC44FF"/>
  <circle cx="14" cy="6" r="1" fill="#CC44FF"/>
  <circle cx="10" cy="5.7" r="0.4" fill="#EEAAFF"/>
  <circle cx="14" cy="5.7" r="0.4" fill="#EEAAFF"/>
  <!-- Nose hole -->
  <ellipse cx="12" cy="7.5" rx="0.8" ry="0.6" fill="#2A1A2A"/>
  <!-- Jaw (exposed teeth) -->
  <path d="M8 9 Q12 11 16 9" fill="#3A2A3A"/>
  <path d="M9 9 L9 10" stroke="#AAA" stroke-width="0.6"/>
  <path d="M10.5 9.3 L10.5 10.3" stroke="#AAA" stroke-width="0.6"/>
  <path d="M12 9.5 L12 10.5" stroke="#AAA" stroke-width="0.6"/>
  <path d="M13.5 9.3 L13.5 10.3" stroke="#AAA" stroke-width="0.6"/>
  <path d="M15 9 L15 10" stroke="#AAA" stroke-width="0.6"/>
  <!-- Arms (long, clawed) -->
  <path d="M5 12 Q2 14 1 18" fill="none" stroke="#5A4A5A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M19 12 Q22 14 23 18" fill="none" stroke="#5A4A5A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Claws (left) -->
  <path d="M1 18 L0 20" stroke="#8A7A8A" stroke-width="1" stroke-linecap="round"/>
  <path d="M1 18 L1.5 20.5" stroke="#8A7A8A" stroke-width="1" stroke-linecap="round"/>
  <path d="M1 18 L2.5 20" stroke="#8A7A8A" stroke-width="1" stroke-linecap="round"/>
  <!-- Claws (right) -->
  <path d="M23 18 L22 20" stroke="#8A7A8A" stroke-width="1" stroke-linecap="round"/>
  <path d="M23 18 L22.5 20.5" stroke="#8A7A8A" stroke-width="1" stroke-linecap="round"/>
  <path d="M23 18 L21.5 20" stroke="#8A7A8A" stroke-width="1" stroke-linecap="round"/>
  <!-- Legs (crouched) -->
  <path d="M8 18 Q6 20 7 22" fill="none" stroke="#4A3A4A" stroke-width="2" stroke-linecap="round"/>
  <path d="M16 18 Q18 20 17 22" fill="none" stroke="#4A3A4A" stroke-width="2" stroke-linecap="round"/>
  <!-- Spine ridges -->
  <path d="M11 3 L12 2 L13 3" fill="#5A4A5A"/>
  <path d="M10.5 4 L12 3 L13.5 4" fill="#5A4A5A"/>
  <!-- Tattered cloth/veil -->
  <path d="M7 10 Q5 12 6 14" fill="none" stroke="#4A3A4A" stroke-width="1" opacity="0.6"/>
  <path d="M17 10 Q19 12 18 14" fill="none" stroke="#4A3A4A" stroke-width="1" opacity="0.6"/>
  <!-- Dark aura -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="#6A2A8A" stroke-width="0.5" opacity="0.3"/>
  <circle cx="12" cy="12" r="11" fill="none" stroke="#6A2A8A" stroke-width="0.3" opacity="0.2"/>
</svg>