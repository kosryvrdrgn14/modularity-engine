<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Shadow -->
  <ellipse cx="8" cy="15" rx="5" ry="1" fill="#000" opacity="0.3"/>
  <!-- Body (massive, hunched) -->
  <rect x="3" y="6" width="10" height="8" rx="2" fill="#4A5A3A"/>
  <!-- Shoulders (extra wide) -->
  <rect x="1" y="6" width="5" height="5" rx="1.5" fill="#3A4A2A"/>
  <rect x="10" y="6" width="5" height="5" rx="1.5" fill="#3A4A2A"/>
  <!-- Head (small relative to body) -->
  <circle cx="8" cy="5" r="3" fill="#5A6A4A"/>
  <!-- Brow ridge -->
  <path d="M5 4 Q8 3 11 4" fill="none" stroke="#2A3A1A" stroke-width="1.2"/>
  <!-- Eyes (glowing red) -->
  <circle cx="6.5" cy="5" r="0.8" fill="#FF2222"/>
  <circle cx="9.5" cy="5" r="0.8" fill="#FF2222"/>
  <circle cx="6.5" cy="4.8" r="0.3" fill="#FF8888"/>
  <circle cx="9.5" cy="4.8" r="0.3" fill="#FF8888"/>
  <!-- Mouth (growling) -->
  <path d="M6 6.5 Q8 7.5 10 6.5" fill="#1A2A0A" stroke="#2A3A1A" stroke-width="0.5"/>
  <!-- Exposed ribcage -->
  <line x1="6" y1="8" x2="6" y2="11" stroke="#3A4A2A" stroke-width="0.8"/>
  <line x1="8" y1="8" x2="8" y2="12" stroke="#3A4A2A" stroke-width="0.8"/>
  <line x1="10" y1="8" x2="10" y2="11" stroke="#3A4A2A" stroke-width="0.8"/>
  <!-- Arms (long, reaching) -->
  <rect x="0" y="7" width="2" height="4" rx="0.8" fill="#4A5A3A"/>
  <rect x="14" y="7" width="2" height="4" rx="0.8" fill="#4A5A3A"/>
  <!-- Claws -->
  <path d="M0 11 L-0.5 12.5 L0.5 12" fill="#3A4A2A"/>
  <path d="M1 11 L0.5 12.5 L1.5 12" fill="#3A4A2A"/>
  <path d="M15 11 L14.5 12.5 L15.5 12" fill="#3A4A2A"/>
  <path d="M16 11 L15.5 12.5 L16.5 12" fill="#3A4A2A"/>
  <!-- Legs (sturdy) -->
  <rect x="4" y="13" width="2.5" height="2" rx="0.8" fill="#3A4A2A"/>
  <rect x="9.5" y="13" width="2.5" height="2" rx="0.8" fill="#3A4A2A"/>
  <!-- Stitches/wounds -->
  <path d="M5 9 L6 9.5 L5 10" fill="none" stroke="#6A7A5A" stroke-width="0.4"/>
  <path d="M11 8 L12 8.5 L11 9" fill="none" stroke="#6A7A5A" stroke-width="0.4"/>
  <!-- Dark aura -->
  <circle cx="8" cy="9" r="7" fill="none" stroke="#2A3A1A" stroke-width="0.3" opacity="0.4"/>
</svg>