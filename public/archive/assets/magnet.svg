<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- Magnetic field lines -->
  <ellipse cx="14" cy="14" rx="12" ry="12" fill="none" stroke="#FF80AB" stroke-width="0.8" opacity="0.25"/>
  <ellipse cx="14" cy="14" rx="10" ry="10" fill="none" stroke="#FF80AB" stroke-width="0.6" opacity="0.2"/>
  <!-- U-magnet shape -->
  <path d="M8 8 L8 18 Q8 24 14 24 Q20 24 20 18 L20 8" fill="none" stroke="#FF4081" stroke-width="4" stroke-linecap="round"/>
  <!-- North pole (red) -->
  <rect x="6" y="6" width="5" height="6" rx="1.5" fill="#F50057"/>
  <text x="8.5" y="11" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="bold" fill="#FFF">N</text>
  <!-- South pole (blue) -->
  <rect x="17" y="6" width="5" height="6" rx="1.5" fill="#2979FF"/>
  <text x="19.5" y="11" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="bold" fill="#FFF">S</text>
  <!-- Center glow -->
  <circle cx="14" cy="16" r="3" fill="#FF80AB" opacity="0.4"/>
  <circle cx="14" cy="16" r="1.5" fill="#FF4081" opacity="0.6"/>
</svg>
