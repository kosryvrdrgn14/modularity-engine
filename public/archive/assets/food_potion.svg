<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Bottle body -->
  <path d="M5 7 Q4 10 4 12 Q4 14 8 14 Q12 14 12 12 Q12 10 11 7 Z" fill="#4A6A8A"/>
  <!-- Bottle neck -->
  <rect x="6.5" y="3" width="3" height="4" rx="0.5" fill="#8AB4D4"/>
  <!-- Cork -->
  <rect x="6" y="2" width="4" height="1.5" rx="0.5" fill="#8B6914"/>
  <!-- Liquid -->
  <path d="M5 8 Q4 10 4 12 Q4 14 8 14 Q12 14 12 12 Q12 10 11 8 Z" fill="#6AAAE4"/>
  <!-- Liquid shine -->
  <path d="M6 9 Q7 8.5 8 9" fill="none" stroke="#FFF" stroke-width="0.3" opacity="0.5"/>
  <!-- Bubbles -->
  <circle cx="7" cy="11" r="0.5" fill="#8AC4F4" opacity="0.6"/>
  <circle cx="9" cy="10" r="0.4" fill="#8AC4F4" opacity="0.5"/>
  <circle cx="8" cy="12" r="0.3" fill="#8AC4F4" opacity="0.4"/>
  <!-- Glow -->
  <ellipse cx="8" cy="11" rx="3" ry="2" fill="#6AAAE4" opacity="0.2"/>
  <!-- Label -->
  <rect x="5.5" y="9" width="5" height="2" rx="0.3" fill="#F5F5DC"/>
  <line x1="6" y1="10" x2="10" y2="10" stroke="#8B7355" stroke-width="0.3"/>
</svg>