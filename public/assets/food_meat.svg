<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Plate -->
  <ellipse cx="8" cy="12" rx="6" ry="2" fill="#8B7355"/>
  <ellipse cx="8" cy="11.5" rx="5.5" ry="1.5" fill="#A08060"/>
  <!-- Meat (steak) -->
  <ellipse cx="8" cy="9" rx="5" ry="3.5" fill="#8B4513"/>
  <!-- Meat texture -->
  <ellipse cx="8" cy="9" rx="4" ry="2.5" fill="#A0522D"/>
  <!-- Grill marks -->
  <line x1="4" y1="8" x2="12" y2="8" stroke="#6B3410" stroke-width="0.5" opacity="0.6"/>
  <line x1="4" y1="10" x2="12" y2="10" stroke="#6B3410" stroke-width="0.5" opacity="0.6"/>
  <!-- Fat marbling -->
  <path d="M5 8 Q7 7.5 9 8" fill="none" stroke="#D4A574" stroke-width="0.4"/>
  <path d="M6 10 Q8 9.5 10 10" fill="none" stroke="#D4A574" stroke-width="0.4"/>
  <!-- Bone -->
  <rect x="11" y="6" width="1.5" height="4" rx="0.5" fill="#F5F5DC"/>
  <circle cx="11.75" cy="6" r="0.8" fill="#E8E8D0"/>
  <!-- Steam -->
  <path d="M6 5 Q6.5 4 6 3" fill="none" stroke="#FFF" stroke-width="0.3" opacity="0.4"/>
  <path d="M8 5 Q8.5 3.5 8 2" fill="none" stroke="#FFF" stroke-width="0.3" opacity="0.4"/>
  <path d="M10 5 Q10.5 4 10 3" fill="none" stroke="#FFF" stroke-width="0.3" opacity="0.4"/>
</svg>