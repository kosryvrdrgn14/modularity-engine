<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Body base -->
  <rect x="12" y="8" width="24" height="28" rx="3" fill="#FFD700"/>
  <!-- Dark gold shadow edges -->
  <rect x="12" y="8" width="24" height="4" rx="3" fill="#B8860B"/>
  <rect x="12" y="32" width="24" height="4" rx="3" fill="#B8860B"/>
  <rect x="12" y="8" width="4" height="28" rx="2" fill="#B8860B" opacity="0.4"/>
  <!-- Armor chest plate -->
  <rect x="16" y="14" width="16" height="14" rx="2" fill="#FFD700"/>
  <rect x="18" y="16" width="12" height="10" rx="1" fill="#FFF8DC"/>
  <!-- Armor highlight -->
  <rect x="20" y="18" width="8" height="4" rx="1" fill="#FFD700" opacity="0.6"/>
  <!-- Visor/helmet -->
  <rect x="18" y="6" width="12" height="8" rx="2" fill="#B8860B"/>
  <rect x="20" y="8" width="8" height="4" rx="1" fill="#FFD700"/>
  <!-- Eye slit -->
  <rect x="21" y="10" width="6" height="2" rx="0.5" fill="#1A1A2E"/>
  <!-- Cape/trail -->
  <path d="M14 36 Q24 44 34 36" fill="none" stroke="#B8860B" stroke-width="3" opacity="0.6"/>
  <path d="M16 38 Q24 46 32 38" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <!-- Shoulder guards -->
  <rect x="8" y="12" width="6" height="8" rx="2" fill="#B8860B"/>
  <rect x="34" y="12" width="6" height="8" rx="2" fill="#B8860B"/>
  <rect x="9" y="13" width="4" height="6" rx="1" fill="#FFD700"/>
  <rect x="35" y="13" width="4" height="6" rx="1" fill="#FFD700"/>
</svg>
