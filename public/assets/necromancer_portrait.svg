<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="necroSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D0B0"/>
      <stop offset="100%" stop-color="#E0B898"/>
    </linearGradient>
    <linearGradient id="necroHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A1A4A"/>
      <stop offset="100%" stop-color="#2A0A3A"/>
    </linearGradient>
    <linearGradient id="necroRobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1A3A"/>
      <stop offset="100%" stop-color="#1A0A2A"/>
    </linearGradient>
    <radialGradient id="necroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AA6ACC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#AA6ACC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="#1A0A2A" stroke="#4A2A6A" stroke-width="2"/>
  <!-- Magic aura -->
  <circle cx="60" cy="60" r="50" fill="url(#necroGlow)"/>
  <!-- Robe (flowing) -->
  <path d="M30 70 Q25 90 20 110 L100 110 Q95 90 90 70 Z" fill="url(#necroRobe)"/>
  <!-- Robe collar -->
  <path d="M35 68 Q60 60 85 68 L90 80 L30 80 Z" fill="#3A2A4A"/>
  <!-- Robe trim -->
  <path d="M20 110 Q60 105 100 110" fill="none" stroke="#6A3A8A" stroke-width="1.5"/>
  <!-- Inner robe detail -->
  <path d="M50 70 L45 95" fill="none" stroke="#4A3A5A" stroke-width="0.8"/>
  <path d="M70 70 L75 95" fill="none" stroke="#4A3A5A" stroke-width="0.8"/>
  <!-- Neck -->
  <rect x="52" y="65" width="16" height="10" fill="url(#necroSkin)"/>
  <!-- Collarbone -->
  <path d="M45 72 Q52 68 60 70 Q68 68 75 72" fill="none" stroke="#D4A080" stroke-width="0.5" opacity="0.5"/>
  <!-- Face -->
  <ellipse cx="60" cy="50" rx="24" ry="28" fill="url(#necroSkin)"/>
  <!-- Hair (long, dark purple, flowing behind) -->
  <path d="M30 40 Q28 60 32 85 Q35 100 38 110" fill="url(#necroHair)"/>
  <path d="M90 40 Q92 60 88 85 Q85 100 82 110" fill="url(#necroHair)"/>
  <!-- Hair bangs -->
  <path d="M36 35 Q45 20 60 18 Q75 20 84 35 Q82 25 72 22 Q60 18 48 22 Q38 25 36 35" fill="url(#necroHair)"/>
  <!-- Side bangs -->
  <path d="M36 35 Q32 48 34 60 Q36 50 38 40" fill="url(#necroHair)"/>
  <path d="M84 35 Q88 48 86 60 Q84 50 82 40" fill="url(#necroHair)"/>
  <!-- Hair shine -->
  <path d="M48 22 Q55 18 62 22" fill="none" stroke="#6A4A7A" stroke-width="1" opacity="0.4"/>
  <!-- Crown/horns (dark crystal) -->
  <polygon points="48,22 44,8 52,18" fill="#6A3A8A"/>
  <polygon points="60,18 60,4 64,16" fill="#8A4AAA"/>
  <polygon points="72,22 76,8 68,18" fill="#6A3A8A"/>
  <!-- Crown gems -->
  <circle cx="52" cy="14" r="1.5" fill="#CC44FF"/>
  <circle cx="60" cy="10" r="2" fill="#AA6ACC"/>
  <circle cx="68" cy="14" r="1.5" fill="#CC44FF"/>
  <!-- Eyes (big, cute, glowing purple) -->
  <!-- Left eye -->
  <ellipse cx="48" cy="48" rx="6" ry="5" fill="#FFF"/>
  <circle cx="48" cy="48" r="4" fill="#8A4AAA"/>
  <circle cx="48" cy="47" r="2.5" fill="#4A1A6A"/>
  <circle cx="46" cy="46" r="1.2" fill="#FFF" opacity="0.8"/>
  <circle cx="49" cy="49" r="0.6" fill="#FFF" opacity="0.5"/>
  <!-- Left eyelashes -->
  <path d="M42 44 Q45 42 48 44" fill="none" stroke="#2A1A0A" stroke-width="1"/>
  <path d="M48 44 Q51 42 54 44" fill="none" stroke="#2A1A0A" stroke-width="1"/>
  <!-- Right eye -->
  <ellipse cx="72" cy="48" rx="6" ry="5" fill="#FFF"/>
  <circle cx="72" cy="48" r="4" fill="#8A4AAA"/>
  <circle cx="72" cy="47" r="2.5" fill="#4A1A6A"/>
  <circle cx="70" cy="46" r="1.2" fill="#FFF" opacity="0.8"/>
  <circle cx="73" cy="49" r="0.6" fill="#FFF" opacity="0.5"/>
  <!-- Right eyelashes -->
  <path d="M66 44 Q69 42 72 44" fill="none" stroke="#2A1A0A" stroke-width="1"/>
  <path d="M72 44 Q75 42 78 44" fill="none" stroke="#2A1A0A" stroke-width="1"/>
  <!-- Eyebrows (thin, arched, mysterious) -->
  <path d="M42 40 Q48 37 54 40" fill="none" stroke="#3A1A4A" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M66 40 Q72 37 78 40" fill="none" stroke="#3A1A4A" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Blush (subtle) -->
  <ellipse cx="40" cy="56" rx="5" ry="3" fill="#FFB0A0" opacity="0.25"/>
  <ellipse cx="80" cy="56" rx="5" ry="3" fill="#FFB0A0" opacity="0.25"/>
  <!-- Nose (small, cute) -->
  <path d="M58 52 Q60 56 62 52" fill="none" stroke="#D4A080" stroke-width="1" stroke-linecap="round"/>
  <!-- Mouth (cute smile with fang) -->
  <path d="M50 62 Q55 67 60 66 Q65 67 70 62" fill="none" stroke="#CC7766" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cute fang -->
  <path d="M62 63 L63 66 L64 63" fill="#FFF" stroke="#DDD" stroke-width="0.3"/>
  <!-- Ears (slightly pointed) -->
  <ellipse cx="34" cy="48" rx="4" ry="6" fill="#E0B898"/>
  <ellipse cx="86" cy="48" rx="4" ry="6" fill="#E0B898"/>
  <!-- Earrings (skull drops) -->
  <circle cx="34" cy="56" r="2.5" fill="#3A2A4A"/>
  <circle cx="34" cy="55.5" r="1.2" fill="#8A7A8A"/>
  <circle cx="33.5" cy="55" r="0.5" fill="#2A1A2A"/>
  <circle cx="34.5" cy="55" r="0.5" fill="#2A1A2A"/>
  <circle cx="86" cy="56" r="2.5" fill="#3A2A4A"/>
  <circle cx="86" cy="55.5" r="1.2" fill="#8A7A8A"/>
  <circle cx="85.5" cy="55" r="0.5" fill="#2A1A2A"/>
  <circle cx="86.5" cy="55" r="0.5" fill="#2A1A2A"/>
  <!-- Staff orb (visible at bottom) -->
  <circle cx="25" cy="100" r="6" fill="#6A3A8A" opacity="0.6"/>
  <circle cx="25" cy="100" r="4" fill="#8A5AAA" opacity="0.7"/>
  <circle cx="25" cy="99" r="2" fill="#AA7ACC" opacity="0.8"/>
  <!-- Magic particles -->
  <circle cx="20" cy="40" r="1" fill="#AA6ACC" opacity="0.5"/>
  <circle cx="100" cy="35" r="0.8" fill="#AA6ACC" opacity="0.4"/>
  <circle cx="15" cy="70" r="0.6" fill="#CC8AEE" opacity="0.3"/>
  <circle cx="105" cy="65" r="0.6" fill="#CC8AEE" opacity="0.3"/>
  <circle cx="30" cy="25" r="0.8" fill="#AA6ACC" opacity="0.4"/>
  <circle cx="90" cy="25" r="0.8" fill="#AA6ACC" opacity="0.4"/>
</svg>