    <rect x="32" y="1" width="15" height="15" rx="3"/>
    <rect x="1" y="32" width="15" height="15" rx="3"/>
    <rect x="32" y="32" width="15" height="15" rx="3"/>
  </g>
  <g fill="#ffcd64" opacity="0.9">
    <circle cx="8.5" cy="8.5" r="2"/>
    <circle cx="39.5" cy="8.5" r="2"/>
    <circle cx="8.5" cy="39.5" r="2"/>
    <circle cx="39.5" cy="39.5" r="2"/>
  </g>
  <g stroke="#c9a25a" stroke-width="2" stroke-dasharray="4 4" opacity="0.65">
    <line x1="18" y1="2" x2="30" y2="2"/>
    <line x1="18" y1="46" x2="30" y2="46"/>
