<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- Coin body -->
  <circle cx="10" cy="10" r="8" fill="#FFD700"/>
  <!-- Dark rim -->
  <circle cx="10" cy="10" r="8" fill="none" stroke="#B8860B" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="10" cy="10" r="6" fill="none" stroke="#B8860B" stroke-width="0.8" opacity="0.5"/>
  <!-- Shine arc -->
  <path d="M6 6 Q10 4 14 6" fill="none" stroke="#FFF8DC" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dollar symbol -->
  <text x="10" y="13" text-anchor="middle" font-family="serif" font-size="9" font-weight="bold" fill="#B8860B">$</text>
</svg>
