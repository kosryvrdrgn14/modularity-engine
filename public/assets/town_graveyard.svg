<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="graveSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0A0A20"/>
      <stop offset="100%" stop-color="#121228"/>
    </linearGradient>
    <radialGradient id="eerieGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4466AA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4466AA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fogGrad" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#8899BB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8899BB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#AABBDD" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#AABBDD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark sky -->
  <rect width="800" height="450" fill="url(#graveSky)"/>

  <!-- Eerie ambient glow -->
  <ellipse cx="400" cy="200" rx="400" ry="250" fill="url(#eerieGlow)"/>

  <!-- Sparse cold stars -->
  <circle cx="60" cy="30" r="0.8" fill="#8899CC" opacity="0.4"/>
  <circle cx="180" cy="55" r="1" fill="#8899CC" opacity="0.5"/>
  <circle cx="320" cy="20" r="0.7" fill="#8899CC" opacity="0.3"/>
  <circle cx="500" cy="40" r="0.9" fill="#8899CC" opacity="0.45"/>
  <circle cx="620" cy="25" r="1.1" fill="#8899CC" opacity="0.55"/>
  <circle cx="740" cy="50" r="0.6" fill="#8899CC" opacity="0.35"/>

  <!-- Pale crescent moon -->
  <circle cx="650" cy="65" r="28" fill="url(#moonGlow3)"/>
  <circle cx="650" cy="65" r="13" fill="#AABBCC" opacity="0.6"/>
  <circle cx="657" cy="60" r="11" fill="#0A0A20"/>

  <!-- Fog layer -->
  <ellipse cx="400" cy="400" rx="450" ry="80" fill="url(#fogGrad)"/>

  <!-- Ground — dark earth -->
  <path d="M0 340 Q100 335 200 338 Q300 332 400 335 Q500 330 600 333 Q700 328 800 330 L800 450 L0 450 Z" fill="#101018"/>
  <path d="M0 355 Q100 352 200 354 Q300 348 400 351 Q500 346 600 349 Q700 344 800 346 L800 450 L0 450 Z" fill="#0C0C14"/>

  <!-- Tombstone 1 — cross -->
  <rect x="120" y="300" width="12" height="40" fill="#2A2A35" rx="1"/>
  <rect x="112" y="308" width="28" height="8" fill="#2A2A35" rx="1"/>

  <!-- Tombstone 2 — rounded -->
  <rect x="220" y="310" width="18" height="30" fill="#252530" rx="8" ry="8"/>
  <line x1="229" y1="315" x2="229" y2="325" stroke="#1A1A25" stroke-width="1"/>

  <!-- Tombstone 3 — tall pointed -->
  <path d="M340 340 L340 295 L349 280 L358 295 L358 340 Z" fill="#222230"/>
  <line x1="349" y1="288" x2="349" y2="310" stroke="#1A1A22" stroke-width="1"/>

  <!-- Tombstone 4 — short slab -->
  <rect x="460" y="320" width="22" height="20" fill="#282835" rx="2"/>

  <!-- Tombstone 5 — cross -->
  <rect x="560" y="305" width="10" height="35" fill="#262630" rx="1"/>
  <rect x="553" y="312" width="24" height="7" fill="#262630" rx="1"/>

  <!-- Tombstone 6 — small rounded -->
  <rect x="680" y="318" width="14" height="22" fill="#242430" rx="6" ry="6"/>

  <!-- Dead tree 1 (left) -->
  <line x1="80" y1="340" x2="75" y2="240" stroke="#1A1520" stroke-width="4"/>
  <line x1="75" y1="260" x2="50" y2="230" stroke="#1A1520" stroke-width="2"/>
  <line x1="75" y1="270" x2="95" y2="245" stroke="#1A1520" stroke-width="2"/>
  <line x1="50" y1="230" x2="35" y2="220" stroke="#1A1520" stroke-width="1.2"/>
  <line x1="95" y1="245" x2="110" y2="225" stroke="#1A1520" stroke-width="1.2"/>

  <!-- Dead tree 2 (right) -->
  <line x1="700" y1="335" x2="710" y2="220" stroke="#1A1520" stroke-width="5"/>
  <line x1="710" y1="250" x2="680" y2="215" stroke="#1A1520" stroke-width="2.5"/>
  <line x1="710" y1="260" x2="740" y2="230" stroke="#1A1520" stroke-width="2.5"/>
  <line x1="680" y1="215" x2="665" y2="200" stroke="#1A1520" stroke-width="1.5"/>
  <line x1="740" y1="230" x2="755" y2="210" stroke="#1A1520" stroke-width="1.5"/>
  <line x1="710" y1="235" x2="725" y2="210" stroke="#1A1520" stroke-width="1.5"/>

  <!-- Iron fence (foreground) -->
  <line x1="0" y1="355" x2="800" y2="355" stroke="#1A1A25" stroke-width="2"/>
  <line x1="30" y1="355" x2="30" y2="338" stroke="#1A1A25" stroke-width="2"/>
  <line x1="50" y1="355" x2="50" y2="338" stroke="#1A1A25" stroke-width="2"/>
  <line x1="70" y1="355" x2="70" y2="338" stroke="#1A1A25" stroke-width="2"/>
  <line x1="90" y1="355" x2="90" y2="338" stroke="#1A1A25" stroke-width="2"/>
  <!-- Fence spikes -->
  <polygon points="28,338 30,333 32,338" fill="#1A1A25"/>
  <polygon points="48,338 50,333 52,338" fill="#1A1A25"/>
  <polygon points="68,338 70,333 72,338" fill="#1A1A25"/>
  <polygon points="88,338 90,333 92,338" fill="#1A1A25"/>

  <!-- Scattered bones -->
  <ellipse cx="420" cy="365" rx="5" ry="2" fill="#2A2A30" opacity="0.6"/>
  <ellipse cx="300" cy="370" rx="4" ry="1.5" fill="#2A2A30" opacity="0.5"/>

  <!-- Fog wisps -->
  <ellipse cx="200" cy="370" rx="60" ry="8" fill="#6677AA" opacity="0.04"/>
  <ellipse cx="500" cy="365" rx="80" ry="10" fill="#6677AA" opacity="0.03"/>
  <ellipse cx="350" cy="380" rx="100" ry="6" fill="#6677AA" opacity="0.05"/>

  <!-- Distant dead trees silhouette -->
  <path d="M0 320 L5 305 L10 320 L15 295 L20 320" fill="#0A0A15" opacity="0.4"/>
  <path d="M780 315 L785 298 L790 315 L795 290 L800 315" fill="#0A0A15" opacity="0.4"/>

  <!-- Eerie purple mist at ground level -->
  <ellipse cx="300" cy="380" rx="120" ry="15" fill="#442266" opacity="0.04"/>
  <ellipse cx="550" cy="375" rx="90" ry="12" fill="#442266" opacity="0.03"/>
</svg>
