<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
  <!-- Cloak (dark green) -->
  <path d="M4 7 Q3 10 2 13 L12 13 Q11 10 10 7 Z" fill="#2A4A2A"/>
  <path d="M2 13 Q7 12 12 13" fill="none" stroke="#3A5A3A" stroke-width="0.4"/>
  <!-- Body -->
  <rect x="5" y="7" width="4" height="3" rx="1" fill="#D4A574"/>
  <!-- Head -->
  <circle cx="7" cy="5" r="2.5" fill="#D4A574"/>
  <!-- Hood -->
  <path d="M4 4 Q5 2 7 1.5 Q9 2 10 4 Q9.5 3 8 2.5 Q7 2.2 6 2.5 Q4.5 3 4 4" fill="#1A3A1A"/>
  <!-- Hair (brown, peeking from hood) -->
  <path d="M5 4 Q4.5 5 5 6" fill="#6A4A2A"/>
  <path d="M9 4 Q9.5 5 9 6" fill="#6A4A2A"/>
  <!-- Eyes (sharp, green) -->
  <circle cx="6" cy="5" r="0.6" fill="#FFF"/>
  <circle cx="6" cy="5" r="0.35" fill="#4A8A2A"/>
  <circle cx="8" cy="5" r="0.6" fill="#FFF"/>
  <circle cx="8" cy="5" r="0.35" fill="#4A8A2A"/>
  <!-- Focused expression -->
  <path d="M6 6 Q7 6.3 8 6" fill="none" stroke="#8A6A4A" stroke-width="0.3"/>
  <!-- Bow (right side) -->
  <path d="M11 3 Q12.5 7 11 11" fill="none" stroke="#6A4A2A" stroke-width="0.5"/>
  <!-- Bowstring -->
  <line x1="11" y1="3" x2="11" y2="11" stroke="#AAA" stroke-width="0.2"/>
  <!-- Arrow (nocked) -->
  <line x1="10" y1="7" x2="11" y2="7" stroke="#8A7A5A" stroke-width="0.3"/>
  <path d="M11 7 L10.5 6.5 L10.5 7.5 Z" fill="#4A8A2A"/>
  <!-- Quiver (back) -->
  <rect x="9" y="4" width="0.8" height="4" rx="0.2" fill="#4A3A2A"/>
  <!-- Arrow tips -->
  <circle cx="9.4" cy="4" r="0.2" fill="#888"/>
  <circle cx="9.4" cy="4.5" r="0.2" fill="#888"/>
  <!-- Belt -->
  <line x1="5" y1="8" x2="9" y2="8" stroke="#4A3A2A" stroke-width="0.4"/>
</svg>