// --- EventBus ---
// Central event routing with re-entrancy protection
class EventBus {
  constructor() {
    this.listeners = new Map();
    this.eventQueue = [];
    this.processing = false;
    this.maxNesting = 32;
    this.nestingDepth = 0;
  }

  on(event, callback) {
    if (!this.listeners.has(event)) {
      this.listeners.set(event, []);
    }
    this.listeners.get(event).push(callback);
  }

  off(event, callback) {
    const list = this.listeners.get(event);
    if (!list) return;
    const idx = list.indexOf(callback);
    if (idx !== -1) list.splice(idx, 1);
  }

  emit(event, data) {
    // If already processing, queue for later (re-entrancy protection)
    if (this.processing) {
      if (this.nestingDepth < this.maxNesting) {
        this.eventQueue.push({ event, data });
      }
      return;
    }

    this.processing = true;
    this.nestingDepth = 0;
    this._dispatch(event, data);
    
    // Process queued events
    while (this.eventQueue.length > 0) {
      const queued = this.eventQueue.shift();
      this._dispatch(queued.event, queued.data);
    }
    
    this.processing = false;
  }

  _dispatch(event, data) {
    this.nestingDepth++;
    const list = this.listeners.get(event);
    if (list) {
      for (let i = 0; i < list.length; i++) {
        list[i](data);
      }
    }
    this.nestingDepth--;
  }

  clear() {
    this.listeners.clear();
    this.eventQueue = [];
    this.processing = false;
    this.nestingDepth = 0;
  }
}

// --- DataManager ---
// Loads and validates JSON content files
class DataManager {
  constructor() {
    this.characters = null;
    this.weapons = null;
    this.enemies = null;
    this.stages = null;
    this.pickups = null;
    this.leveling = null;
  }

  async loadAll(onProgress) {
    const files = [
      { key: 'characters', path: 'content/characters.json' },
      { key: 'weapons', path: 'content/weapons.json' },
      { key: 'enemies', path: 'content/enemies.json' },
      { key: 'stages', path: 'content/stages.json' },
      { key: 'pickups', path: 'content/pickups.json' },
      { key: 'leveling', path: 'content/leveling.json' },
    ];

    const results = await Promise.all(
      files.map(async (file, idx) => {
        if (onProgress) onProgress(idx / files.length, `Loading ${file.key}...`);
        try {
          const response = await fetch(file.path);
          if (!response.ok) throw new Error(`Failed to load ${file.path}`);
          const data = await response.json();
          return { key: file.key, data, error: null };
        } catch (error) {
          console.warn(`Could not load ${file.path}, using embedded data`);
          return { key: file.key, data: null, error };
        }
      })
    );

    // Use embedded data as fallback
    for (const result of results) {
      if (result.data) {
        this[result.key] = result.data;
      } else {
        this[result.key] = this.getEmbeddedData(result.key);
      }
    }

    if (onProgress) onProgress(1, 'Ready');
    return true;
  }

  getEmbeddedData(key) {
    return EMBEDDED_DATA[key];
  }
}

// --- GameState ---
// State machine with validated transitions
class GameState {
  constructor(eventBus) {
    this.eventBus = eventBus;
    this.state = 'loading';
    this.previousState = null;
    this.endResult = null;
    this.endStats = null;

    // Valid transitions table
    this.transitions = {
      loading: ['menu', 'playing'],
      menu: ['playing'],
      playing: ['paused', 'levelUp', 'gameOver'],
      paused: ['playing'],
      levelUp: ['playing'],
      gameOver: ['endScreen'],
      endScreen: ['menu', 'playing'],
    };
  }

  canTransition(newState) {
    const allowed = this.transitions[this.state];
    return allowed && allowed.includes(newState);
  }

  setState(newState, data) {
    if (!this.canTransition(newState)) {
      console.warn(`Invalid transition: ${this.state} → ${newState}`);
      return false;
    }
    this.previousState = this.state;
    this.state = newState;
    this.eventBus.emit('stateChange', { from: this.previousState, to: newState, data });
    return true;
  }

  isPlaying() { return this.state === 'playing'; }
  isPaused() { return this.state === 'paused'; }
  isLevelUp() { return this.state === 'levelUp'; }
  isGameOver() { return this.state === 'gameOver'; }
  isEndScreen() { return this.state === 'endScreen'; }

  triggerGameOver(result, stats) {
    // Prevent multiple triggers
    if (this.state === 'gameOver' || this.state === 'endScreen') return;
    this.endResult = result;
    this.endStats = stats;
    this.setState('gameOver');
  }

  reset() {
    this.state = 'menu';
    this.previousState = null;
    this.endResult = null;
    this.endStats = null;
  }
}

// --- GameLoop ---
// Fixed-timestep update/render at 60 FPS
class GameLoop {
  constructor(updateFn, renderFn) {
    this.updateFn = updateFn;
    this.renderFn = renderFn;
    this.running = false;
    this.paused = false;
    this.frameCount = 0;
    this.timestep = 1000 / 60; // 16.67ms
    this.accumulator = 0;
    this.lastTime = 0;
    this.maxDelta = 1000 / 30; // Clamp to 33ms (max 2 frames)
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.lastTime = performance.now();
    this._loop(this.lastTime);
  }

  stop() {
    this.running = false;
  }

  _loop(currentTime) {
    if (!this.running) return;

    let delta = currentTime - this.lastTime;
    this.lastTime = currentTime;

    // Clamp delta time (safeguard P7)
    if (delta > this.maxDelta) delta = this.maxDelta;

    this.accumulator += delta;

    // Fixed-timestep updates
    while (this.accumulator >= this.timestep) {
      if (!this.paused) {
        this.updateFn(this.timestep / 1000); // Pass delta in seconds
        this.frameCount++;
      }
      this.accumulator -= this.timestep;
    }

    // Render
    this.renderFn(this.accumulator / this.timestep);

    requestAnimationFrame((t) => this._loop(t));
  }
}

// --- Camera ---
// Follows player with smooth lerp
class Camera {
  constructor(canvas) {
    this.canvas = canvas;
    this.x = 0;
    this.y = 0;
    this.targetX = 0;
    this.targetY = 0;
    this.lerp = 0.1;
    this.shakeX = 0;
    this.shakeY = 0;
    this.shakeTimer = 0;
    this.shakeIntensity = 0;
  }

  follow(target) {
    this.targetX = target.x - this.canvas.width / 2;
    this.targetY = target.y - this.canvas.height / 2;
  }

  shake(intensity, duration) {
    this.shakeIntensity = intensity;
    this.shakeTimer = duration;
  }

  update(dt) {
    // Smooth lerp
    this.x += (this.targetX - this.x) * this.lerp;
    this.y += (this.targetY - this.y) * this.lerp;

    // Screen shake
    if (this.shakeTimer > 0) {
      this.shakeTimer -= dt;
      this.shakeX = (Math.random() - 0.5) * this.shakeIntensity * 2;
      this.shakeY = (Math.random() - 0.5) * this.shakeIntensity * 2;
    } else {
      this.shakeX = 0;
      this.shakeY = 0;
    }
  }

  apply(ctx) {
    ctx.translate(
      Math.round(-this.x + this.shakeX),
      Math.round(-this.y + this.shakeY)
    );
  }

  screenToWorld(screenX, screenY) {
    return { x: screenX + this.x, y: screenY + this.y };
  }

  worldToScreen(worldX, worldY) {
    return { x: worldX - this.x, y: worldY - this.y };
  }
}

// --- InputManager ---
// Handles mouse/touch click-to-move and WASD/arrow keys
class InputManager {
  constructor(canvas, eventBus) {
    this.canvas = canvas;
    this.eventBus = eventBus;
    
    // Click/tap target
    this.targetX = 0;
    this.targetY = 0;
    this.hasTarget = false;
    
    // WASD/Arrow state
    this.keys = {};
    
    // Touch tracking
    this.touchId = null;
    
    // Pause state (prevents movement clicks during levelUp/pause)
    this._isPaused = false;
    this._upgradeKeyLock = false;
    
    this._bindEvents();
  }

  _bindEvents() {
    // Mouse
    this.canvas.addEventListener('mousedown', (e) => this._onPointerDown(e.clientX, e.clientY));
    this.canvas.addEventListener('mousemove', (e) => {
      if (e.buttons & 1) this._onPointerMove(e.clientX, e.clientY);
    });
    
    // Touch
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      this.touchId = touch.identifier;
      this._onPointerDown(touch.clientX, touch.clientY);
    });
    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        if (touch.identifier === this.touchId) {
          this._onPointerMove(touch.clientX, touch.clientY);
        }
      }
    });
    this.canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      this.touchId = null;
    });
    
    // Keyboard
    window.addEventListener('keydown', (e) => {
      this.keys[e.code] = true;
      if (e.code === 'Escape') {
        this.eventBus.emit('pause', { paused: true });
      }
      // Upgrade selection during levelUp state (debounced)
      if (e.code === 'Digit1' || e.code === 'Numpad1') {
        if (!this._upgradeKeyLock) { this._upgradeKeyLock = true; this.eventBus.emit('selectUpgrade', { index: 0 }); }
      } else if (e.code === 'Digit2' || e.code === 'Numpad2') {
        if (!this._upgradeKeyLock) { this._upgradeKeyLock = true; this.eventBus.emit('selectUpgrade', { index: 1 }); }
      } else if (e.code === 'Digit3' || e.code === 'Numpad3') {
        if (!this._upgradeKeyLock) { this._upgradeKeyLock = true; this.eventBus.emit('selectUpgrade', { index: 2 }); }
      }
      // Restart on end screen
      if (e.code === 'Enter' || e.code === 'Space') {
        this.eventBus.emit('restart');
      }
    });
    window.addEventListener('keyup', (e) => {
      this.keys[e.code] = false;
      // Reset upgrade lock when ANY number key is released
      if (e.code === 'Digit1' || e.code === 'Numpad1' ||
          e.code === 'Digit2' || e.code === 'Numpad2' ||
          e.code === 'Digit3' || e.code === 'Numpad3') {
        this._upgradeKeyLock = false;
      }
    });
  }

  _onPointerDown(screenX, screenY) {
    // Reset keyboard lock on any click (cross-input cleanup)
    this._upgradeKeyLock = false;
    
    const rect = this.canvas.getBoundingClientRect();
    const x = (screenX - rect.left) * (this.canvas.width / rect.width);
    const y = (screenY - rect.top) * (this.canvas.height / rect.height);
    
    // Check if clicking on upgrade cards during levelUp state (debounced)
    const cardIndex = this._getUpgradeCardAt(x, y);
    if (cardIndex >= 0) {
      if (!this._upgradeKeyLock) { this._upgradeKeyLock = true; this.eventBus.emit('selectUpgrade', { index: cardIndex }); }
      return;
    }
    
    // Check if clicking to restart on end screen
    if (this._game && (this._game.gameState.isGameOver() || this._game.gameState.isEndScreen())) {
      this.eventBus.emit('restart');
      return;
    }
    
    // Ignore movement clicks during levelUp/paused state
    if (this._isPaused) return;
    
    this.targetX = x;
    this.targetY = y;
    this.hasTarget = true;
  }

  _getUpgradeCardAt(x, y) {
    // Card layout must match UIManager._renderLevelUp()
    const w = this.canvas.width;
    const h = this.canvas.height;
    const cardWidth = 160;
    const cardHeight = 200;
    const spacing = 20;
    const startX = (w - (cardWidth * 3 + spacing * 2)) / 2;
    const cardY = h / 2 - 80;

    for (let i = 0; i < 3; i++) {
      const cardX = startX + i * (cardWidth + spacing);
      if (x >= cardX && x <= cardX + cardWidth && y >= cardY && y <= cardY + cardHeight) {
        return i;
      }
    }
    return -1;
  }

  _onPointerMove(screenX, screenY) {
    const rect = this.canvas.getBoundingClientRect();
    this.targetX = (screenX - rect.left) * (this.canvas.width / rect.width);
    this.targetY = (screenY - rect.top) * (this.canvas.height / rect.height);
  }

  isKeyDown(code) {
    return !!this.keys[code];
  }

  getMovement() {
    let dx = 0, dy = 0;
    if (this.isKeyDown('KeyW') || this.isKeyDown('ArrowUp')) dy -= 1;
    if (this.isKeyDown('KeyS') || this.isKeyDown('ArrowDown')) dy += 1;
    if (this.isKeyDown('KeyA') || this.isKeyDown('ArrowLeft')) dx -= 1;
    if (this.isKeyDown('KeyD') || this.isKeyDown('ArrowRight')) dx += 1;
    // Normalize diagonal
    if (dx !== 0 && dy !== 0) {
      const inv = 1 / Math.sqrt(2);
      dx *= inv;
      dy *= inv;
    }
    return { dx, dy };
  }

  clearTarget() {
    this.hasTarget = false;
  }
}

// --- EntityManager ---
// Object pooling for game entities
class EntityManager {
  constructor() {
    this.entities = [];
    this.nextId = 1;
    this.pools = {
      enemy: [],
      projectile: [],
      pickup: [],
      orb: [],
    };
    this.poolLimits = {
      enemy: 200,
      projectile: 500,
      pickup: 500,
      orb: 50,
    };
  }

  create(type, data) {
    const entity = {
      ...data,
      id: this.nextId++,
      type,
      active: true,
      x: data.x || 0,
      y: data.y || 0,
      vx: data.vx || 0,
      vy: data.vy || 0,
      hp: data.hp || 0,
      maxHp: data.hp || 0,
      damage: data.damage || 0,
      speed: data.speed || 0,
      size: data.size || 10,
      stats: data.stats || {},
      behavior: data.behavior || null,
      weaponData: data.weaponData || null,
      pickupData: data.pickupData || null,
      visual: data.visual || {},
      iFrames: 0,
      age: 0,
    };
    this.entities.push(entity);
    return entity;
  }

  destroy(entity) {
    entity.active = false;
  }

  clearAll() {
    this.entities = [];
    this.nextId = 1;
  }

  getActive(type) {
    if (type) {
      return this.entities.filter(e => e.active && e.type === type);
    }
    return this.entities.filter(e => e.active);
  }

  getCount(type) {
    return this.entities.filter(e => e.active && e.type === type).length;
  }

  cleanup() {
    // Remove inactive entities (safeguard P6 - separate cleanup phase)
    this.entities = this.entities.filter(e => e.active);
  }

  getPoolCount(type) {
    return this.pools[type] ? this.pools[type].length : 0;
  }
}

// --- SpawnSystem ---
// Spawns enemies based on wave timeline
class SpawnSystem {
  constructor(entityManager, dataManager, eventBus) {
    this.entityManager = entityManager;
    this.dataManager = dataManager;
    this.eventBus = eventBus;
    this.spawnTimer = 0;
    this.gameTime = 0;
    this.currentWave = 0;
    this.bossSpawned = false;
  }

  update(dt) {
    this.gameTime += dt;
    
    const stage = this.dataManager.stages;
    const wave = this._getCurrentWave(stage.waves);
    
    if (!wave) return;
    
    // Check spawn cap
    const enemyCount = this.entityManager.getCount('enemy') + this.entityManager.getCount('boss');
    if (enemyCount >= wave.maxEnemies) return;
    
    // Spawn rate with accumulator pattern
    this.spawnTimer += dt;
    const spawnInterval = 1 / wave.spawnRate;
    
    while (this.spawnTimer >= spawnInterval) {
      this.spawnTimer -= spawnInterval;
      this._spawnEnemy(wave);
    }
    
    // Boss spawn at 4:00 (240 seconds)
    if (!this.bossSpawned && this.gameTime >= 240) {
      this._spawnBoss();
      this.bossSpawned = true;
    }
  }

  _getCurrentWave(waves) {
    for (let i = waves.length - 1; i >= 0; i--) {
      const parts = waves[i].time.split('-');
      const start = this._parseTime(parts[0]);
      if (this.gameTime >= start) {
        return waves[i];
      }
    }
    return waves[0];
  }

  _parseTime(str) {
    const [min, sec] = str.split(':').map(Number);
    return min * 60 + sec;
  }

  _spawnEnemy(wave) {
    const enemies = this.dataManager.enemies.filter(e => e.type === 'normal');
    const weights = wave.compositionWeights;
    
    // Weighted random selection
    let totalWeight = 0;
    for (const enemy of enemies) {
      totalWeight += (weights[enemy.id] || 0);
    }
    
    if (totalWeight <= 0) return;
    
    let roll = Math.random() * totalWeight;
    let selected = enemies[0];
    
    for (const enemy of enemies) {
      roll -= (weights[enemy.id] || 0);
      if (roll <= 0) {
        selected = enemy;
        break;
      }
    }
    
    // Spawn at random position around player
    const angle = Math.random() * Math.PI * 2;
    const dist = 400 + Math.random() * 200;
    const player = this.entityManager.getActive('player')[0];
    const px = player ? player.x : 0;
    const py = player ? player.y : 0;
    
    this.entityManager.create('enemy', {
      x: px + Math.cos(angle) * dist,
      y: py + Math.sin(angle) * dist,
      hp: selected.stats.hp,
      damage: selected.stats.damage,
      speed: selected.stats.speed,
      size: selected.stats.size,
      enemyData: selected,
      visual: { shape: 'square', color: this._getEnemyColor(selected.id) },
    });
  }

  _spawnBoss() {
    const boss = this.dataManager.enemies.find(e => e.type === 'boss');
    if (!boss) return;
    
    const angle = Math.random() * Math.PI * 2;
    const dist = 500;
    const player = this.entityManager.getActive('player')[0];
    const px = player ? player.x : 0;
    const py = player ? player.y : 0;
    
    this.entityManager.create('enemy', {
      x: px + Math.cos(angle) * dist,
      y: py + Math.sin(angle) * dist,
      hp: boss.stats.hp,
      damage: boss.stats.damage,
      speed: boss.stats.speed,
      size: boss.stats.size,
      enemyData: boss,
      isBoss: true,
      visual: { shape: 'square', color: '#4A0000' },
    });
    
    this.eventBus.emit('bossSpawn', { boss });
  }

  _getEnemyColor(id) {
    const colors = {
      zombie: '#3B8A30',   // Brighter green — visible against dark bg
      bat: '#6B3FA0',      // Purple — was invisible (matched bg color)
      skeleton: '#C0392B', // Bright red
      ghost: '#8E44AD',    // Light purple
      caster: '#2E86C1',   // Blue
    };
    return colors[id] || '#555';
  }

  reset() {
    this.spawnTimer = 0;
    this.gameTime = 0;
    this.currentWave = 0;
    this.bossSpawned = false;
  }
}

// --- MovementSystem ---
// Handles player pathfinding and enemy movement
class MovementSystem {
  constructor(entityManager, inputManager) {
    this.entityManager = entityManager;
    this.inputManager = inputManager;
  }

  update(dt) {
    const player = this.entityManager.getActive('player')[0];
    if (!player) return;

    // Player movement
    this._movePlayer(player, dt);
    
    // Enemy movement
    this._moveEnemies(player, dt);
    
    // Projectile movement
    this._moveProjectiles(dt);
    
    // Pickup floating
    this._updatePickups(dt);
  }

  _movePlayer(player, dt) {
    const kb = this.inputManager.getMovement();
    
    if (kb.dx !== 0 || kb.dy !== 0) {
      // WASD movement
      player.x += kb.dx * player.speed * dt;
      player.y += kb.dy * player.speed * dt;
      this.inputManager.clearTarget();
    } else if (this.inputManager.hasTarget) {
      // Click/tap movement
      const dx = this.inputManager.targetX - player.x;
      const dy = this.inputManager.targetY - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist > 5) {
        const speed = Math.min(player.speed * dt, dist);
        player.x += (dx / dist) * speed;
        player.y += (dy / dist) * speed;
      } else {
        this.inputManager.clearTarget();
      }
    }
  }

  _moveEnemies(player, dt) {
    const enemies = this.entityManager.getActive('enemy');
    
    for (const enemy of enemies) {
      if (enemy.isBoss) {
        this._moveBoss(enemy, player, dt);
        continue;
      }
      
      const behavior = enemy.enemyData?.behavior?.pattern || 'chase';
      const dx = player.x - enemy.x;
      const dy = player.y - enemy.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (behavior === 'swarm') {
        // Bat: fast with erratic movement
        if (dist > 1) {
          const erraticX = (Math.random() - 0.5) * 60;
          const erraticY = (Math.random() - 0.5) * 60;
          enemy.x += ((dx + erraticX) / dist) * enemy.speed * dt;
          enemy.y += ((dy + erraticY) / dist) * enemy.speed * dt;
        }
      } else if (behavior === 'wander_chase') {
        // Ghost: wander sometimes, chase other times
        if (!enemy._wanderTimer) enemy._wanderTimer = 0;
        if (!enemy._isChasing) enemy._isChasing = false;
        enemy._wanderTimer -= dt;
        if (enemy._wanderTimer <= 0) {
          enemy._isChasing = !enemy._isChasing;
          enemy._wanderTimer = enemy._isChasing ? 4 : 2;
        }
        if (enemy._isChasing && dist > 1) {
          enemy.x += (dx / dist) * enemy.speed * dt;
          enemy.y += (dy / dist) * enemy.speed * dt;
        } else {
          // Wander
          if (!enemy._wanderDx) {
            enemy._wanderDx = (Math.random() - 0.5) * 2;
            enemy._wanderDy = (Math.random() - 0.5) * 2;
          }
          enemy.x += enemy._wanderDx * enemy.speed * 0.5 * dt;
          enemy.y += enemy._wanderDy * enemy.speed * 0.5 * dt;
        }
      } else if (behavior === 'ranged') {
        // Caster: maintain distance
        const preferredDist = 150;
        if (dist < preferredDist - 30 && dist > 1) {
          // Too close, back away
          enemy.x -= (dx / dist) * enemy.speed * dt;
          enemy.y -= (dy / dist) * enemy.speed * dt;
        } else if (dist > preferredDist + 30 && dist > 1) {
          // Too far, approach
          enemy.x += (dx / dist) * enemy.speed * dt;
          enemy.y += (dy / dist) * enemy.speed * dt;
        }
        // Stand still if in range (ranged attackers don't chase)
      } else {
        // Default chase (zombie, skeleton)
        if (dist > 1) {
          enemy.x += (dx / dist) * enemy.speed * dt;
          enemy.y += (dy / dist) * enemy.speed * dt;
        } else {
          enemy.x -= dt * 10;
        }
      }
    }
  }

  _moveBoss(boss, player, dt) {
    // Boss charge behavior
    if (!boss._bossState) {
      boss._bossState = 'chase';
      boss._stateTimer = 3;
      boss._chargeDir = { x: 0, y: 0 };
    }
    
    boss._stateTimer -= dt;
    const dx = player.x - boss.x;
    const dy = player.y - boss.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (boss._bossState === 'chase') {
      // Move toward player
      if (dist > 1) {
        boss.x += (dx / dist) * boss.speed * dt;
        boss.y += (dy / dist) * boss.speed * dt;
      }
      if (boss._stateTimer <= 0) {
        // Start charge windup
        boss._bossState = 'windup';
        boss._stateTimer = 0.5;
        if (dist > 1) {
          boss._chargeDir = { x: dx / dist, y: dy / dist };
        }
      }
    } else if (boss._bossState === 'windup') {
      // Telegraph (slight pause)
      if (boss._stateTimer <= 0) {
        boss._bossState = 'charge';
        boss._stateTimer = 1.5;
      }
    } else if (boss._bossState === 'charge') {
      // Rush toward player's position at high speed
      boss.x += boss._chargeDir.x * boss.speed * 3 * dt;
      boss.y += boss._chargeDir.y * boss.speed * 3 * dt;
      if (boss._stateTimer <= 0) {
        boss._bossState = 'pause';
        boss._stateTimer = 1.0;
      }
    } else if (boss._bossState === 'pause') {
      // Pause after charge
      if (boss._stateTimer <= 0) {
        boss._bossState = 'chase';
        boss._stateTimer = 3;
      }
    }
  }

  _moveProjectiles(dt) {
    const projectiles = this.entityManager.getActive('projectile');
    
    for (const proj of projectiles) {
      proj.x += proj.vx * dt;
      proj.y += proj.vy * dt;
      proj.age = (proj.age || 0) + dt;
      proj.distanceTraveled = (proj.distanceTraveled || 0) + Math.sqrt(proj.vx * proj.vx + proj.vy * proj.vy) * dt;
      
      // Despawn after 3 seconds or 600px traveled
      if (proj.age > 3 || proj.distanceTraveled > 600) {
        this.entityManager.destroy(proj);
      }
    }
  }

  _updatePickups(dt) {
    const pickups = this.entityManager.getActive('pickup');
    for (const pickup of pickups) {
      pickup.age = (pickup.age || 0) + dt;
      // Float animation
      pickup.floatOffset = Math.sin(pickup.age * 3) * 2;
    }
  }
}

// PHASE 7: COLLISION SYSTEM
// ============================================================

// --- CollisionSystem ---
// AABB collision detection
class CollisionSystem {
  constructor(entityManager, eventBus) {
    this.entityManager = entityManager;
    this.eventBus = eventBus;
  }

  update() {
    const player = this.entityManager.getActive('player')[0];
    if (!player) return;

    const enemies = this.entityManager.getActive('enemy');
    const projectiles = this.entityManager.getActive('projectile');
    const pickups = this.entityManager.getActive('pickup');

    // Player vs Enemy (contact damage)
    for (const enemy of enemies) {
      if (this._checkAABB(player, enemy)) {
        this.eventBus.emit('contactDamage', { target: player, source: enemy, damage: enemy.damage });
      }
    }

    // Projectile vs Enemy
    for (const proj of projectiles) {
      for (const enemy of enemies) {
        if (this._checkAABB(proj, enemy)) {
          this.eventBus.emit('projectileHit', { projectile: proj, target: enemy, damage: proj.damage });
          this.entityManager.destroy(proj);
          break;
        }
      }
    }

    // Orb vs Enemy
    const orbs = this.entityManager.getActive('orb');
    for (const orb of orbs) {
      for (const enemy of enemies) {
        if (this._checkAABB(orb, enemy)) {
          // Check damage cooldown per enemy for this orb
          if (!orb._hitEnemies) orb._hitEnemies = {};
          const hitKey = enemy.id;
          if (!orb._hitEnemies[hitKey] || orb._hitEnemies[hitKey] <= 0) {
            this.eventBus.emit('projectileHit', { projectile: orb, target: enemy, damage: orb.damage });
            orb._hitEnemies[hitKey] = 0.5; // 0.5s cooldown per enemy
          }
        }
      }
      // Decay hit cooldowns
      if (orb._hitEnemies) {
        for (const key in orb._hitEnemies) {
          orb._hitEnemies[key] = Math.max(0, orb._hitEnemies[key] - 1/60);
        }
      }
    }

    // Player vs Pickup (proximity collection)
    const collectRange = (player.stats.pickupRange || 50);
    for (const pickup of pickups) {
      const dx = pickup.x - player.x;
      const dy = pickup.y - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < collectRange) {
        this.eventBus.emit('pickup', { player, pickup });
        this.entityManager.destroy(pickup);
      }
    }
  }

  _checkAABB(a, b) {
    return a.x - a.size < b.x + b.size &&
           a.x + a.size > b.x - b.size &&
           a.y - a.size < b.y + b.size &&
           a.y + a.size > b.y - b.size;
  }
}

// PHASE 8: WEAPON SYSTEM

// --- WeaponSystem ---
// Handles weapon cooldowns, targeting, and firing
class WeaponSystem {
  constructor(entityManager, dataManager, eventBus) {
    this.entityManager = entityManager;
    this.dataManager = dataManager;
    this.eventBus = eventBus;
    this.weaponLevels = {};
    this.cooldowns = {};
  }

  init(player) {
    // Start with W1
    this.weaponLevels['w1_projectile'] = 1;
    this.cooldowns['w1_projectile'] = 0;
  }

  update(dt) {
    const player = this.entityManager.getActive('player')[0];
    if (!player) return;

    // Update cooldowns
    for (const weaponId in this.cooldowns) {
      this.cooldowns[weaponId] = Math.max(0, this.cooldowns[weaponId] - dt);
    }

    // Fire weapons
    this._fireW1(player, dt);
    this._fireW2(player, dt);
    this._fireW3(player, dt);
  }

  _fireW1(player, dt) {
    const level = this.weaponLevels['w1_projectile'];
    if (!level) return;

    if (this.cooldowns['w1_projectile'] > 0) return;

    const weapon = this.dataManager.weapons[0];
    const stats = weapon.statsPerLevel[level - 1];
    this.cooldowns['w1_projectile'] = stats.cooldown;

    // Find nearest enemy
    const enemies = this.entityManager.getActive('enemy');
    if (enemies.length === 0) return;

    let nearest = null;
    let minDist = Infinity;
    for (const enemy of enemies) {
      const dx = enemy.x - player.x;
      const dy = enemy.y - player.y;
      const dist = dx * dx + dy * dy;
      if (dist < minDist) {
        minDist = dist;
        nearest = enemy;
      }
    }

    if (!nearest) return;

    // Fire projectile
    const dx = nearest.x - player.x;
    const dy = nearest.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) return;  // Guard: enemy on top of player
    const speed = 400;

    const finalDamage = Math.floor(stats.damage * (player.damageMultiplier || 1));
    const projCount = stats.projectileCount || 1;
    const baseAngle = Math.atan2(dy, dx);
    const spreadAngle = 0.25;
    for (let i = 0; i < projCount; i++) {
      const angle = projCount === 1 ? baseAngle : baseAngle + (i - (projCount - 1) / 2) * spreadAngle;
      this.entityManager.create('projectile', {
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        damage: finalDamage,
        size: 4,
        visual: { shape: 'square', color: '#FFD700' },
      });
    }
    // GAP 1 FIX: Emit weaponFire so AudioManager can play w1_fire
    this.eventBus.emit('weaponFire', { weaponId: 'w1_projectile' });
  }

  _fireW2(player, dt) {
    const level = this.weaponLevels['w2_orbit'];
    if (!level) return;

    const weapon = this.dataManager.weapons[1];
    const stats = weapon.statsPerLevel[level - 1];
    const orbCount = stats.orbitCount;

    // Maintain orbs
    const existingOrbs = this.entityManager.getActive('orb').filter(o => o.ownerId === player.id);
    
    // Remove excess orbs
    while (existingOrbs.length > orbCount) {
      this.entityManager.destroy(existingOrbs.pop());
    }

    // Create missing orbs
    while (existingOrbs.length < orbCount) {
      const orbDmg = Math.floor(stats.damage * (player.damageMultiplier || 1));
      const orb = this.entityManager.create('orb', {
        ownerId: player.id,
        x: player.x,
        y: player.y,
        damage: orbDmg,
        size: 6,
        orbitAngle: (existingOrbs.length / orbCount) * Math.PI * 2,
        orbitRadius: stats.orbitRadius,
        orbitSpeed: stats.orbitSpeed,
        visual: { shape: 'circle', color: '#4FC3F7' },
      });
      existingOrbs.push(orb);
    }

    // Update orb positions
    for (const orb of existingOrbs) {
      orb.orbitAngle += dt * (Math.PI * 2 / orb.orbitSpeed);
      orb.x = player.x + Math.cos(orb.orbitAngle) * orb.orbitRadius;
      orb.y = player.y + Math.sin(orb.orbitAngle) * orb.orbitRadius;
    }
  }

  _fireW3(player, dt) {
    const level = this.weaponLevels['w3_area'];
    if (!level) return;
    // W3 is active — this line only prints once per fire cycle after cooldown

    this.cooldowns['w3_area'] = (this.cooldowns['w3_area'] || 0) - dt;
    if (this.cooldowns['w3_area'] > 0) return;

    const weapon = this.dataManager.weapons[2];
    if (!weapon || !weapon.statsPerLevel) {
      console.error('[W3] Weapon data missing!', weapon);
      return;
    }
    const stats = weapon.statsPerLevel[level - 1];
    if (!stats) {
      console.error('[W3] Stats missing for level', level);
      return;
    }
    this.cooldowns['w3_area'] = stats.cooldown;

    // Emit area pulse event(s)
    const pulseDmg = Math.floor(stats.damage * (player.damageMultiplier || 1));
    const pulseCount = stats.pulseCount || 1;
    for (let i = 0; i < pulseCount; i++) {
      setTimeout(() => {
        this.eventBus.emit('areaPulse', {
          x: player.x,
          y: player.y,
          damage: pulseDmg,
          radius: stats.pulseRadius,
          pulseCount: pulseCount,
        });
      }, i * 250);
    }
  }

  levelUp(weaponId) {
    const current = this.weaponLevels[weaponId] || 0;
    if (current < 7) {
      this.weaponLevels[weaponId] = current + 1;
      this.eventBus.emit('weaponLevelUp', { weaponId, newLevel: current + 1 });
    }
  }

  unlockWeapon(weaponId) {
    if (!this.weaponLevels[weaponId]) {
      this.weaponLevels[weaponId] = 1;
      this.cooldowns[weaponId] = 0;
    }
  }

  getWeaponLevel(weaponId) {
    return this.weaponLevels[weaponId] || 0;
  }

  reset() {
    this.weaponLevels = {};
    this.cooldowns = {};
  }
}

// --- DamageSystem ---
// Applies damage, crits, knockback, invincibility
class DamageSystem {
  constructor(entityManager, eventBus, renderer) {
    this.entityManager = entityManager;
    this.eventBus = eventBus;
    this.renderer = renderer;
  }

  init() {
    this.eventBus.on('contactDamage', (data) => this._handleDamage(data.target, data.source, data.damage));
    this.eventBus.on('projectileHit', (data) => this._handleProjectileHit(data));
    this.eventBus.on('areaPulse', (data) => this._handleAreaPulse(data));
  }

  _handleDamage(target, source, baseDamage) {
    if (!target || !target.active) return;
    if (target.iFrames > 0) return;

    // Apply armor
    const armor = target.stats.armor || 0;
    const afterArmor = Math.max(1, baseDamage - armor);

    // Apply crit
    const critChance = source.stats?.critChance || 0;
    const critMultiplier = source.stats?.critMultiplier || 1.5;
    const isCrit = Math.random() < critChance;
    const finalDamage = isCrit ? Math.floor(afterArmor * critMultiplier) : afterArmor;

    target.hp -= finalDamage;
    target.iFrames = 0.5;

    this.eventBus.emit('damage', {
      target,
      source,
      damage: finalDamage,
      isCrit,
      position: { x: target.x, y: target.y },
    });

    if (target.hp <= 0) {
      target.active = false;
      this.eventBus.emit('death', {
        entity: target,
        killer: source,
        position: { x: target.x, y: target.y },
      });
      // Boss death triggers victory
      if (target.isBoss) {
        this.eventBus.emit('bossDeath', { boss: target, killer: source });
      }
    }
  }

  _handleProjectileHit(data) {
    const player = this.entityManager.getActive('player')[0];
    this._handleDamage(data.target, { stats: player?.stats || {} }, data.projectile.damage);
  }

  _handleAreaPulse(data) {
    const enemies = this.entityManager.getActive('enemy');
    const player = this.entityManager.getActive('player')[0];
    for (const enemy of enemies) {
      const dx = enemy.x - data.x;
      const dy = enemy.y - data.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < data.radius) {
        this._handleDamage(enemy, { stats: player?.stats || {} }, data.damage);
      }
    }
    // Visual pulse effect
    if (this.renderer) {
      this.renderer.addPulseEffect(data.x, data.y, data.radius, '#FF9100');
    }
  }

  update(dt) {
    // Update iFrames
    const all = this.entityManager.getActive();
    for (const entity of all) {
      if (entity.iFrames > 0) {
        entity.iFrames = Math.max(0, entity.iFrames - dt);
      }
    }
  }
}

// --- PickupSystem ---
// Handles item drops and magnet attraction
class PickupSystem {
  constructor(entityManager, dataManager, eventBus) {
    this.entityManager = entityManager;
    this.dataManager = dataManager;
    this.eventBus = eventBus;
    this.magnetActive = false;
    this.magnetTimer = 0;
  }

  init() {
    this.eventBus.on('death', (data) => this._onEnemyDeath(data));
    this.eventBus.on('magnetActivate', (data) => this._onMagnetActivate(data));
  }

  _onEnemyDeath(data) {
    const enemy = data.entity;
    if (!enemy.enemyData) return;

    // Drop XP gem
    this.entityManager.create('pickup', {
      x: data.position.x + (Math.random() - 0.5) * 20,
      y: data.position.y + (Math.random() - 0.5) * 20,
      pickupData: { id: 'exp_small', value: enemy.enemyData.stats.xpValue },
      visual: { shape: 'diamond', color: '#4FC3F7', size: 8 },
    });

    // Drop gold coins
    const goldCoins = enemy.enemyData.stats.goldCoins;
    if (goldCoins) {
      const count = goldCoins.min + Math.floor(Math.random() * (goldCoins.max - goldCoins.min + 1));
      for (let i = 0; i < count; i++) {
        this.entityManager.create('pickup', {
          x: data.position.x + (Math.random() - 0.5) * 60,
          y: data.position.y + (Math.random() - 0.5) * 60,
          pickupData: { id: 'gold_coin', value: 1 },
          visual: { shape: 'circle', color: '#FFD700', size: 10 },
        });
      }
    }

    // Drop power-ups
    const drops = enemy.enemyData.drops.powerUpTable;
    for (const drop of drops) {
      if (Math.random() < drop.chance) {
        this.entityManager.create('pickup', {
          x: data.position.x,
          y: data.position.y,
          pickupData: { id: drop.type },
          visual: this._getPowerUpVisual(drop.type),
          isPowerUp: true,
        });
        break;
      }
    }
  }

  _getPowerUpVisual(type) {
    const visuals = {
      screen_wipe: { shape: 'star', color: '#00E676', size: 16 },
      magnet: { shape: 'circle', color: '#FF4081', size: 14 },
      weapon_levelup: { shape: 'triangle', color: '#FF9100', size: 16 },
    };
    return visuals[type] || { shape: 'circle', color: '#FFF', size: 12 };
  }

  _onMagnetActivate(data) {
    this.magnetActive = true;
    this.magnetTimer = 10; // 10 seconds
  }

  update(dt) {
    if (!this.magnetActive) return;

    this.magnetTimer -= dt;
    if (this.magnetTimer <= 0) {
      this.magnetActive = false;
      return;
    }

    // Attract pickups
    const player = this.entityManager.getActive('player')[0];
    if (!player) return;

    const pickups = this.entityManager.getActive('pickup');
    for (const pickup of pickups) {
      const dx = player.x - pickup.x;
      const dy = player.y - pickup.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < 350 && dist > 0) {
        const speed = 400;
        pickup.x += (dx / dist) * speed * dt;
        pickup.y += (dy / dist) * speed * dt;
      }
    }
  }

  reset() {
    this.magnetActive = false;
    this.magnetTimer = 0;
  }
}

// --- LevelingSystem ---
// Tracks XP and triggers level-ups
class LevelingSystem {
  constructor(entityManager, dataManager, eventBus) {
    this.entityManager = entityManager;
    this.dataManager = dataManager;
    this.eventBus = eventBus;
    this.level = 1;
    this.xp = 0;
    this.queue = [];
  }

  init() {
    this.eventBus.on('pickup', (data) => this._onPickup(data));
    this.eventBus.on('death', (data) => this._onEnemyDeath(data));
  }

  _onPickup(data) {
    if (data.pickup.pickupData?.id === 'exp_small') {
      this.addXP(data.pickup.pickupData.value);
    } else if (data.pickup.pickupData?.id === 'gold_coin') {
      // Gold is tracked separately (not implemented yet)
    }
  }

  _onEnemyDeath(data) {
    // XP from kills is handled via pickups
  }

  addXP(amount) {
    this.xp += amount;
    
    while (this.xp >= this._getXpToNext(this.level) && this.queue.length < 3) {
      const xpNeeded = this._getXpToNext(this.level);
      this.xp -= xpNeeded;
      this.level++;
      this.queue.push(this.level);
      this.eventBus.emit('levelUp', { level: this.level });
    }
  }

  _getXpToNext(level) {
    const curve = this.dataManager.leveling.xpCurve;
    const entry = curve.find(e => e.level === level);
    if (entry) return entry.xpToNext;
    // Formula for level 14+
    return Math.floor(375 * Math.pow(1.3, level - 14));
  }

  hasPendingLevelUp() {
    return this.queue.length > 0;
  }

  getNextLevel() {
    return this.queue[0];
  }

  consumeLevelUp() {
    return this.queue.shift();
  }

  reset() {
    this.level = 1;
    this.xp = 0;
    this.queue = [];
  }

  update(dt) {
    // Leveling system is event-driven, no per-frame updates needed
    // This method exists for consistency with other systems
  }
}

// --- Renderer ---
// Canvas 2D rendering
class Renderer {
  constructor(canvas, camera) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.camera = camera;
    this.pulseEffects = [];
    this.bossEntity = null;
  }

  addPulseEffect(x, y, radius, color) {
    this.pulseEffects.push({ x, y, radius, color, age: 0, maxAge: 0.5 });
  }

  _updateAndDrawPulses(dt) {
    for (let i = this.pulseEffects.length - 1; i >= 0; i--) {
      const p = this.pulseEffects[i];
      p.age += dt || 1/60;
      if (p.age >= p.maxAge) {
        this.pulseEffects.splice(i, 1);
        continue;
      }
      const progress = p.age / p.maxAge;
      const currentRadius = p.radius * progress;
      const ctx = this.ctx;
      
      // Semi-transparent fill (shockwave body)
      ctx.beginPath();
      ctx.arc(p.x, p.y, currentRadius, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.25 * (1 - progress);
      ctx.fill();
      
      // Bright stroke (shockwave edge)
      ctx.beginPath();
      ctx.arc(p.x, p.y, currentRadius, 0, Math.PI * 2);
      ctx.strokeStyle = p.color;
      ctx.globalAlpha = 0.7 * (1 - progress);
      ctx.lineWidth = 5;
      ctx.stroke();
      
      ctx.globalAlpha = 1;
    }
  }

  clear() {
    this.ctx.fillStyle = '#1A1A2E';
    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
  }

  render(entities, player) {
    this.clear();
    this.ctx.save();
    this.camera.apply(this.ctx);

    // Draw grid
    this._drawGrid();

    // Draw entities (y-sorted, filter active first to avoid NaN from dead entities)
    const sorted = entities.filter(e => e.active).sort((a, b) => a.y - b.y);
    for (const entity of sorted) {
      this._drawEntity(entity);
    }

    // Draw pulse effects (after entities, before camera restore)
    this._updateAndDrawPulses(1/60);

    this.ctx.restore();

    // Draw UI overlay (not affected by camera)
    this._drawUI(player);
  }

  _drawGrid() {
    const gridSize = 50;
    const startX = Math.floor(this.camera.x / gridSize) * gridSize;
    const startY = Math.floor(this.camera.y / gridSize) * gridSize;
    
    this.ctx.strokeStyle = '#16213E';
    this.ctx.lineWidth = 1;
    
    for (let x = startX; x < this.camera.x + this.canvas.width + gridSize; x += gridSize) {
      this.ctx.beginPath();
      this.ctx.moveTo(x, this.camera.y);
      this.ctx.lineTo(x, this.camera.y + this.canvas.height);
      this.ctx.stroke();
    }
    for (let y = startY; y < this.camera.y + this.canvas.height + gridSize; y += gridSize) {
      this.ctx.beginPath();
      this.ctx.moveTo(this.camera.x, y);
      this.ctx.lineTo(this.camera.x + this.canvas.width, y);
      this.ctx.stroke();
    }
  }

  _drawEntity(entity) {
    const ctx = this.ctx;
    ctx.save();
    
    // iFrame blink
    if (entity.iFrames > 0 && Math.floor(entity.iFrames * 10) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }

    const x = Math.round(entity.x);
    const y = Math.round(entity.y);
    const size = entity.size;
    const color = entity.visual?.color || '#FFF';
    const shape = entity.visual?.shape || 'square';

    ctx.fillStyle = color;

    if (shape === 'square') {
      ctx.fillRect(x - size, y - size, size * 2, size * 2);
    } else if (shape === 'circle') {
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
    } else if (shape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.lineTo(x + size, y);
      ctx.lineTo(x, y + size);
      ctx.lineTo(x - size, y);
      ctx.closePath();
      ctx.fill();
    } else if (shape === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(x, y - size);
      ctx.lineTo(x + size, y + size);
      ctx.lineTo(x - size, y + size);
      ctx.closePath();
      ctx.fill();
    } else if (shape === 'star') {
      this._drawStar(x, y, size, 5);
    }

    ctx.restore();
  }

  _drawStar(x, y, radius, points) {
    const ctx = this.ctx;
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? radius : radius * 0.5;
      const angle = (i * Math.PI) / points - Math.PI / 2;
      if (i === 0) ctx.moveTo(x + r * Math.cos(angle), y + r * Math.sin(angle));
      else ctx.lineTo(x + r * Math.cos(angle), y + r * Math.sin(angle));
    }
    ctx.closePath();
    ctx.fill();
  }

  _drawUI(player) {
    if (!player) return;
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;

    // HP Bar
    const hpPercent = player.hp / player.maxHp;
    ctx.fillStyle = '#333';
    ctx.fillRect(10, 10, 200, 16);
    ctx.fillStyle = hpPercent > 0.25 ? '#EF4444' : '#FF0000';
    ctx.fillRect(10, 10, 200 * hpPercent, 16);
    ctx.strokeStyle = '#FFF';
    ctx.strokeRect(10, 10, 200, 16);

    // Level
    ctx.fillStyle = '#3B82F6';
    ctx.beginPath();
    ctx.arc(w - 30, 18, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFF';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.level || 1, w - 30, 22);

    // Boss Health Bar (if boss is alive)
    if (this.bossEntity && this.bossEntity.active) {
      const bossHp = this.bossEntity.hp / this.bossEntity.maxHp;
      ctx.fillStyle = '#333';
      ctx.fillRect(w/2 - 120, 40, 240, 14);
      ctx.fillStyle = bossHp > 0.25 ? '#C0392B' : '#FF0000';
      ctx.fillRect(w/2 - 120, 40, 240 * bossHp, 14);
      ctx.strokeStyle = '#FFF';
      ctx.lineWidth = 1;
      ctx.strokeRect(w/2 - 120, 40, 240, 14);
      ctx.fillStyle = '#FFF';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('THE GRAVEKEEPER', w/2, 51);
    }

    // EXP Bar
    ctx.fillStyle = '#333';
    ctx.fillRect(0, h - 20, w, 20);
    ctx.fillStyle = '#4FC3F7';
    ctx.fillRect(0, h - 20, w * (this.xpPercent || 0), 20);
  }
}

// ============================================================
// PHASE 12b: FLOATING TEXT SYSTEM
// ============================================================

class FloatingTextSystem {
  constructor(eventBus) {
    this.texts = [];
    eventBus.on('damage', (data) => this._onDamage(data));
    eventBus.on('pickup', (data) => this._onPickup(data));
  }

  _onDamage(data) {
    if (!data.position) return;
    const isCrit = data.isCrit;
    this.texts.push({
      x: data.position.x + (Math.random() - 0.5) * 10,
      y: data.position.y - 10,
      text: isCrit ? `${data.damage}!` : `${data.damage}`,
      color: isCrit ? '#FFD700' : '#FFF',
      fontSize: isCrit ? 16 : 12,
      age: 0,
      maxAge: 0.8,
      vy: -40,
    });
  }

  _onPickup(data) {
    if (!data.pickup?.pickupData) return;
    const pd = data.pickup.pickupData;
    let text = '', color = '#FFF';
    if (pd.id === 'exp_small') { text = `+${pd.value} XP`; color = '#4FC3F7'; }
    else if (pd.id === 'gold_coin') { text = `+${pd.value} G`; color = '#FFD700'; }
    else if (pd.id === 'weapon_levelup') { text = 'WEAPON UP!'; color = '#FF9100'; }
    else if (pd.id === 'screen_wipe') { text = 'SCREEN WIPE!'; color = '#00E676'; }
    else if (pd.id === 'magnet') { text = 'MAGNET!'; color = '#FF4081'; }
    if (text) {
      this.texts.push({
        x: data.player.x + (Math.random() - 0.5) * 20,
        y: data.player.y - 20,
        text, color,
        fontSize: pd.id.includes('wipe') || pd.id === 'magnet' ? 14 : 10,
        age: 0, maxAge: 1.0, vy: -30,
      });
    }
  }

  update(dt) {
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.age += dt;
      t.y += t.vy * dt;
      if (t.age >= t.maxAge) {
        this.texts.splice(i, 1);
      }
    }
  }

  draw(ctx) {
    for (const t of this.texts) {
      const alpha = Math.max(0, 1 - t.age / t.maxAge);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = t.color;
      ctx.font = `bold ${t.fontSize}px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
}
