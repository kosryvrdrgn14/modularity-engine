// --- UIManager ---
// HUD, level-up screen, end screens
class UIManager {
  constructor(canvas, eventBus) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.eventBus = eventBus;
    this.levelUpOptions = null;
    this.endScreen = null;
  }

  showLevelUp(options) {
    this.levelUpOptions = options;
  }

  hideLevelUp() {
    this.levelUpOptions = null;
  }

  showEndScreen(result, stats) {
    this.endScreen = { result, stats };
  }

  hideEndScreen() {
    this.endScreen = null;
  }

  render() {
    if (this.levelUpOptions) this._renderLevelUp();
    if (this.endScreen) this._renderEndScreen();
  }

  _renderLevelUp() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;

    // Overlay
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, w, h);

    // Title
    ctx.fillStyle = '#3B82F6';
    ctx.font = 'bold 32px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL UP!', w / 2, h / 2 - 120);

    // Cards
    const cardWidth = 160;
    const cardHeight = 200;
    const spacing = 20;
    const startX = (w - (cardWidth * 3 + spacing * 2)) / 2;

    for (let i = 0; i < 3; i++) {
      const x = startX + i * (cardWidth + spacing);
      const y = h / 2 - 80;

      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(x, y, cardWidth, cardHeight);
      ctx.strokeStyle = '#3B82F6';
      ctx.strokeRect(x, y, cardWidth, cardHeight);

      ctx.fillStyle = '#FFF';
      ctx.font = '14px monospace';
      ctx.fillText(`[${i + 1}]`, x + cardWidth / 2, y + 30);
      ctx.fillText(this.levelUpOptions[i]?.name || 'Upgrade', x + cardWidth / 2, y + 60);
    }

    ctx.fillStyle = '#666';
    ctx.font = '12px monospace';
    ctx.fillText('Press 1, 2, or 3 to select', w / 2, h / 2 + 140);
  }

  _renderEndScreen() {
    const ctx = this.ctx;
    const w = this.canvas.width;
    const h = this.canvas.height;

    // Overlay
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, w, h);

    // Title
    const titles = { victory: 'VICTORY', survived: 'SURVIVED', defeat: 'DEFEATED' };
    const colors = { victory: '#FFD700', survived: '#FFF', defeat: '#EF4444' };
    
    ctx.fillStyle = colors[this.endScreen.result] || '#FFF';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(titles[this.endScreen.result] || 'GAME OVER', w / 2, h / 2 - 50);

    // Stats
    if (this.endScreen.stats) {
      ctx.font = '16px monospace';
      ctx.fillStyle = '#CCC';
      const stats = this.endScreen.stats;
      ctx.fillText(`Time: ${stats.time || '0:00'}`, w / 2, h / 2 + 10);
      ctx.fillText(`Level: ${stats.level || 1}`, w / 2, h / 2 + 40);
      ctx.fillText(`Kills: ${stats.kills || 0}`, w / 2, h / 2 + 70);
      ctx.fillText(`Gold: ${stats.gold || 0}`, w / 2, h / 2 + 100);
    }

    ctx.fillStyle = '#666';
    ctx.font = '14px monospace';
    ctx.fillText('Click to restart', w / 2, h / 2 + 150);
  }
}

// ============================================================
// PHASE 14: AUDIO SYSTEM (Full Implementation)
// ============================================================

class AudioManager {
  constructor(eventBus) {
    this.eventBus = eventBus;
    this.ctx = null;
    this.initialized = false;
    this.player = null;

    // Master / channel gains
    this.masterGain = null;
    this.sfxGain = null;
    this.musicGain = null;
    this.uiGain = null;

    // 16-slot SFX pool
    this.sfxSlots = [];
    this.MAX_SLOTS = 16;

    // Payout triad engine state
    this.C_MAJOR_SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
    this.comboIndex = 0;
    this.lastPickupTime = 0;
    this.COMBO_TIMEOUT = 0.6;

    // Priority ducking state
    this.activeDucks = [];
    this.duckTimers = [];

    // Boss active state
    this.bossActive = false;

    // Continuous sounds
    this._orbitHumNode = null;
    this._orbitHumGain = null;
    this._orbitHumRunning = false;
    this._magnetHumNode = null;
    this._magnetHumGain = null;
    this._magnetTimer = 0;
  }

  // ─────────────────────────────────────────────
  // INITIALIZATION
  // ─────────────────────────────────────────────

  init() {
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.initialized = true;

      // Master gain
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.8;
      this.masterGain.connect(this.ctx.destination);

      // Channel gains
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.85;
      this.sfxGain.connect(this.masterGain);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.7;
      this.musicGain.connect(this.masterGain);

      this.uiGain = this.ctx.createGain();
      this.uiGain.gain.value = 1.0;
      this.uiGain.connect(this.masterGain);

      // Init SFX pool
      for (let i = 0; i < this.MAX_SLOTS; i++) {
        this.sfxSlots.push({ active: false, startTime: 0, priority: 10, gainNode: null });
      }

      // Wire game events
      this._wireEvents();

    } catch (e) {
      console.warn('Web Audio not supported');
    }
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setPlayer(player) {
    this.player = player;
  }

  // ─────────────────────────────────────────────
  // EVENT WIRING — Map game events to sounds
  // ─────────────────────────────────────────────

  _wireEvents() {
    const bus = this.eventBus;

    // PICKUP — route by pickupData.id
    bus.on('pickup', (data) => {
      const id = data.pickup?.pickupData?.id;
      if (id === 'exp_small') this._playPickupTriad(data.pickup);
      else if (id === 'gold_coin') this._playGoldArpeggio(data.pickup);
      else if (id === 'weapon_levelup' || id === 'magnet' || id === 'health') this._playPowerUpArpeggio(data.pickup);
      else if (id === 'screen_wipe') this.play('screenwipe');
    });

    // DEATH — route by enemy type (skip boss — handled by bossDeath)
    bus.on('death', (data) => {
      if (data.type === 'boss_gravekeeper') return;
      if (data.type === 'player') { this.play('player_death'); return; }
      const killMap = { zombie: 'zombie_kill', bat: 'bat_kill', skeleton: 'skeleton_kill', ghost: 'ghost_kill', caster: 'caster_kill' };
      if (killMap[data.type]) this.play(killMap[data.type]);
    });

    // WEAPON EVENTS
    bus.on('weaponFire', (data) => {
      if (data.weaponId === 'w1_projectile') this.play('w1_fire');
    });
    bus.on('projectileHit', () => this.play('weapon_hit'));
    bus.on('areaPulse', () => this.play('w3_pulse'));
    bus.on('weaponLevelUp', () => this.play('powerup_collect'));
    bus.on('weaponUnlock', (data) => {
      this.play('weapon_unlock');
      // Start W2 hum if orbit weapon unlocked
      if (data.weaponId === 'w2_orbit') this.startOrbitHum();
    });

    // PLAYER DAMAGE
    bus.on('contactDamage', () => this.play('player_hurt'));

    // LEVEL UP & UI
    bus.on('levelUp', () => this.play('levelup'));
    bus.on('selectUpgrade', () => this.play('ui_click'));

    // BOSS
    bus.on('bossSpawn', (data) => {
      this.bossActive = true;
      this.play('boss_spawn');
      this._duckForBoss(true);
    });
    bus.on('bossDeath', () => {
      this.bossActive = false;
      this.play('boss_death');
      this._duckForBoss(false);
      this.stopOrbitHum();
    });
    bus.on('bossCharge', (data) => {
      if (data.phase === 'windup') this.play('boss_charge');
    });

    // MAGNET
    bus.on('magnetActivate', () => this._startMagnetHum());

    // RESTART
    bus.on('restart', () => {
      this.play('restart');
      this.stopOrbitHum();
      this._stopMagnetHum();
      this.bossActive = false;
    });

    // GAME OVER (player death triggers this)
    bus.on('stateChange', (data) => {
      if (data.to === 'gameOver' || data.to === 'endScreen') {
        this.stopOrbitHum();
        this._stopMagnetHum();
      }
    });
  }

  // ─────────────────────────────────────────────
  // SOUND POOL — 16-slot eviction
  // ─────────────────────────────────────────────

  _acquireSlot(priority) {
    // Find free slot
    for (let i = 0; i < this.MAX_SLOTS; i++) {
      if (!this.sfxSlots[i].active) return i;
    }
    // All occupied — evict lowest priority (highest number = lowest)
    let worstIdx = 0;
    let worstPri = -1;
    for (let i = 0; i < this.MAX_SLOTS; i++) {
      if (this.sfxSlots[i].priority > worstPri) {
        worstPri = this.sfxSlots[i].priority;
        worstIdx = i;
      }
    }
    // Don't evict if new sound is lower priority
    if (priority > worstPri) return -1;
    // Stop the evicted sound
    this._stopSlot(worstIdx);
    return worstIdx;
  }

  _stopSlot(idx) {
    const slot = this.sfxSlots[idx];
    if (!slot.active) return;
    try {
      if (slot.oscillator) { slot.oscillator.stop(); slot.oscillator.disconnect(); }
      if (slot.noiseSource) { slot.noiseSource.stop(); slot.noiseSource.disconnect(); }
      if (slot.gainNode) slot.gainNode.disconnect();
      if (slot.filterNode) slot.filterNode.disconnect();
    } catch (e) { /* already stopped */ }
    slot.active = false;
  }

  _releaseSlot(idx) {
    const slot = this.sfxSlots[idx];
    if (!slot) return;
    setTimeout(() => this._stopSlot(idx), 50);
  }

  // ─────────────────────────────────────────────
  // PLAY — Main entry point
  // ─────────────────────────────────────────────

  play(soundId, opts) {
    if (!this.ctx || !this.initialized) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    opts = opts || {};
    const priority = opts.priority || 9;
    const channel = opts.channel || 'sfx';
    const dist = this._getDistance(opts.sourceX, opts.sourceY);
    const vol = this._distanceVolume(dist, opts.minVol);

    switch (soundId) {
      // WEAPONS
      case 'w1_fire': this._synthW1Fire(vol); break;
      case 'w3_pulse': this._synthW3Pulse(vol); break;
      case 'weapon_hit': this._synthWeaponHit(vol); break;
      case 'weapon_unlock': this._synthWeaponUnlock(vol, channel); break;

      // ENEMY KILLS
      case 'zombie_kill': this._synthEnemyKill(vol, 'zombie'); break;
      case 'bat_kill': this._synthEnemyKill(vol, 'bat'); break;
      case 'skeleton_kill': this._synthEnemyKill(vol, 'skeleton'); break;
      case 'ghost_kill': this._synthEnemyKill(vol, 'ghost'); break;
      case 'caster_kill': this._synthEnemyKill(vol, 'caster'); break;

      // BOSS
      case 'boss_spawn': this._synthBossSpawn(vol, channel); break;
      case 'boss_death': this._synthBossDeath(vol, channel); break;
      case 'boss_charge': this._synthBossCharge(vol); break;

      // PLAYER
      case 'player_hurt': this._synthPlayerHurt(vol, channel); break;
      case 'player_death': this._synthPlayerDeath(vol, channel); break;

      // UI
      case 'levelup': this._synthLevelUp(vol, channel); break;
      case 'ui_click': this._synthUIClick(vol, channel); break;
      case 'restart': this._synthRestart(vol, channel); break;

      // POWER-UPS
      case 'powerup_collect': this._synthPowerUp(vol, channel); break;
      case 'screenwipe': this._synthScreenWipe(vol, channel); break;

      default: break;
    }
  }

  // ─────────────────────────────────────────────
  // DISTANCE-BASED AUDIO
  // ─────────────────────────────────────────────

  _getDistance(sourceX, sourceY) {
    if (!this.player || sourceX == null || sourceY == null) return 0;
    const dx = sourceX - this.player.x;
    const dy = sourceY - this.player.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  _distanceVolume(dist, minVol) {
    minVol = minVol || 0.2;
    if (dist <= 0) return 1.0;
    if (dist <= 100) return 1.0;
    if (dist <= 200) return 0.7;
    if (dist <= 400) return 0.4;
    return minVol;
  }

  // ─────────────────────────────────────────────
  // PAYOUT TRIAD ENGINE — XP & Gold pickups
  // ─────────────────────────────────────────────

  _playPickupTriad(pickupEntity) {
    const now = this.ctx.currentTime;
    // Combo stepping
    if (now - this.lastPickupTime > this.COMBO_TIMEOUT) this.comboIndex = 0;
    this.lastPickupTime = now;

    const baseFreq = this.C_MAJOR_SCALE[this.comboIndex % this.C_MAJOR_SCALE.length];
    this.comboIndex++;

    const gain = 0.08 + Math.random() * 0.04; // 0.08–0.12
    const jitter = (Math.random() - 0.5) * 30; // ±15 Hz

    // 3-note arpeggio: Base → x1.5 → x2.0
    const notes = [baseFreq + jitter, (baseFreq + jitter) * 1.5, (baseFreq + jitter) * 2.0];
    const noteLen = 0.015;
    const noteGap = 0.02;

    for (let i = 0; i < notes.length; i++) {
      this._playNote(notes[i], gain, now + i * noteGap, noteLen, 'square', 'sfx');
    }
  }

  _playGoldArpeggio(pickupEntity) {
    const now = this.ctx.currentTime;
    if (now - this.lastPickupTime > this.COMBO_TIMEOUT) this.comboIndex = 0;
    this.lastPickupTime = now;

    const baseFreq = this.C_MAJOR_SCALE[this.comboIndex % this.C_MAJOR_SCALE.length];
    this.comboIndex++;

    const gain = 0.09 + Math.random() * 0.04;
    const jitter = (Math.random() - 0.5) * 30;

    // Brighter pattern: Base → x1.25 → x1.5
    const notes = [baseFreq + jitter, (baseFreq + jitter) * 1.25, (baseFreq + jitter) * 1.5];
    const noteLen = 0.012;
    const noteGap = 0.018;

    for (let i = 0; i < notes.length; i++) {
      this._playNote(notes[i], gain, now + i * noteGap, noteLen, 'square', 'sfx');
    }
  }

  // ─────────────────────────────────────────────
  // SYNTHESIS — All sound functions
  // ─────────────────────────────────────────────

  // Helper: play a single note
  _playNote(freq, vol, startTime, duration, waveform, channel) {
    const slotIdx = this._acquireSlot(9);
    if (slotIdx < 0) return;
    const slot = this.sfxSlots[slotIdx];
    slot.active = true;
    slot.startTime = startTime;
    slot.priority = 9;

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = waveform || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.003);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);

    const dest = channel === 'ui' ? this.uiGain : this.sfxGain;
    osc.connect(gain);
    gain.connect(dest);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.01);

    slot.oscillator = osc;
    slot.gainNode = gain;
    slot.filterNode = null;

    osc.onended = () => {
      slot.active = false;
      try { osc.disconnect(); gain.disconnect(); } catch(e) {}
    };
  }

  // Helper: noise burst
  _playNoise(vol, startTime, duration, filterFreq, filterQ, channel) {
    const slotIdx = this._acquireSlot(8);
    if (slotIdx < 0) return;
    const slot = this.sfxSlots[slotIdx];
    slot.active = true;
    slot.startTime = startTime;
    slot.priority = 8;

    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const source = this.ctx.createBufferSource();
    source.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq || 800;
    filter.Q.value = filterQ || 1;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime + 0.002);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);

    const dest = channel === 'ui' ? this.uiGain : this.sfxGain;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(dest);
    source.start(startTime);
    source.stop(startTime + duration + 0.01);

    slot.noiseSource = source;
    slot.gainNode = gain;
    slot.filterNode = filter;

    source.onended = () => {
      slot.active = false;
      try { source.disconnect(); filter.disconnect(); gain.disconnect(); } catch(e) {}
    };
  }

  // --- WEAPON SOUNDS ---

  _synthW1Fire(vol) {
    // Short square blip, pitch scales with damage
    const freq = 600 + Math.random() * 200;
    this._playNote(freq, vol * 0.12, this.ctx.currentTime, 0.03, 'square', 'sfx');
  }

  _synthW3Pulse(vol) {
    // Sawtooth → LP filter burst: 800Hz → 200Hz over 0.3s
    const t = this.ctx.currentTime;
    const slotIdx = this._acquireSlot(6);
    if (slotIdx < 0) return;
    const slot = this.sfxSlots[slotIdx];
    slot.active = true; slot.startTime = t; slot.priority = 6;

    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.linearRampToValueAtTime(200, t + 0.3);

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.2, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.35);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(t);
    osc.stop(t + 0.4);

    slot.oscillator = osc; slot.gainNode = gain; slot.filterNode = filter;
    osc.onended = () => { slot.active = false; };
  }

  _synthWeaponHit(vol) {
    // Short noise burst 200–800Hz
    this._playNoise(vol * 0.08, this.ctx.currentTime, 0.03, 500, 1.5, 'sfx');
  }

  _synthWeaponUnlock(vol, channel) {
    // Rising triad: C5→E5→G5
    const t = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99];
    for (let i = 0; i < notes.length; i++) {
      this._playNote(notes[i], vol * 0.18, t + i * 0.05, 0.08, 'square', channel);
    }
  }

  // --- ENEMY KILL SOUNDS ---

  _synthEnemyKill(vol, type) {
    const t = this.ctx.currentTime;
    const freqs = {
      zombie: { start: 400, end: 100, dur: 0.15, wave: 'square' },
      bat: { start: 1200, end: 800, dur: 0.08, wave: 'square' },
      skeleton: { start: 300, end: 150, dur: 0.2, wave: 'square' },
      ghost: { start: 600, end: 200, dur: 0.3, wave: 'sine' },
      caster: { start: 500, end: 200, dur: 0.15, wave: 'square' },
    };
    const s = freqs[type] || freqs.zombie;

    const slotIdx = this._acquireSlot(7);
    if (slotIdx < 0) return;
    const slot = this.sfxSlots[slotIdx];
    slot.active = true; slot.startTime = t; slot.priority = 7;

    const osc = this.ctx.createOscillator();
    osc.type = s.wave;
    osc.frequency.setValueAtTime(s.start, t);
    osc.frequency.linearRampToValueAtTime(s.end, t + s.dur);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.12, t);
    gain.gain.linearRampToValueAtTime(0, t + s.dur);

    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(t);
    osc.stop(t + s.dur + 0.01);

    slot.oscillator = osc; slot.gainNode = gain;

    // Skeleton gets a layered noise (armor clank)
    if (type === 'skeleton') {
      this._playNoise(vol * 0.06, t, 0.1, 600, 2, 'sfx');
    }
    // Ghost gets an ethereal wail (sine + slight reverb feel via second osc)
    if (type === 'ghost') {
      const osc2 = this.ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(s.start * 1.5, t);
      osc2.frequency.linearRampToValueAtTime(s.end * 0.5, t + s.dur);
      const g2 = this.ctx.createGain();
      g2.gain.setValueAtTime(vol * 0.05, t);
      g2.gain.linearRampToValueAtTime(0, t + s.dur);
      osc2.connect(g2); g2.connect(this.sfxGain);
      osc2.start(t); osc2.stop(t + s.dur + 0.01);
    }

    osc.onended = () => { slot.active = false; };
  }

  // --- BOSS SOUNDS ---

  _synthBossSpawn(vol, channel) {
    // Ground-shaking impact: 80Hz → 40Hz
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.linearRampToValueAtTime(40, t + 1.0);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.25, t);
    gain.gain.linearRampToValueAtTime(0, t + 1.0);

    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(t);
    osc.stop(t + 1.05);

    // Layered noise
    this._playNoise(vol * 0.15, t, 0.5, 100, 0.5, channel);
  }

  _synthBossDeath(vol, channel) {
    // Layered: 60Hz + 120Hz + 240Hz over 2.0s
    const t = this.ctx.currentTime;
    const freqs = [60, 120, 240];
    for (const freq of freqs) {
      const osc = this.ctx.createOscillator();
      osc.type = freq === 60 ? 'sine' : 'square';
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.linearRampToValueAtTime(freq * 0.5, t + 2.0);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol * 0.15, t);
      gain.gain.linearRampToValueAtTime(0, t + 2.0);

      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(t);
      osc.stop(t + 2.05);
    }
    // Deep noise burst
    this._playNoise(vol * 0.12, t, 0.8, 80, 0.5, channel);
  }

  _synthBossCharge(vol) {
    // Low sweep: 80Hz → 120Hz over 0.4s (warning growl)
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(80, t);
    osc.frequency.linearRampToValueAtTime(120, t + 0.4);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.15, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.45);

    osc.connect(gain);
    gain.connect(this.sfxGain);
    osc.start(t);
    osc.stop(t + 0.5);
  }

  // --- PLAYER SOUNDS ---

  _synthPlayerHurt(vol, channel) {
    // 200Hz → 100Hz blunt impact
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.linearRampToValueAtTime(100, t + 0.1);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.18, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.12);

    osc.connect(gain);
    gain.connect(channel === 'ui' ? this.uiGain : this.sfxGain);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  _synthPlayerDeath(vol, channel) {
    // Slow descending wail: 400Hz → 50Hz over 1.5s
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, t);
    osc.frequency.linearRampToValueAtTime(50, t + 1.5);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.2, t);
    gain.gain.linearRampToValueAtTime(0, t + 1.6);

    osc.connect(gain);
    gain.connect(channel === 'ui' ? this.uiGain : this.sfxGain);
    osc.start(t);
    osc.stop(t + 1.7);
  }

  // --- UI SOUNDS ---

  _synthLevelUp(vol, channel) {
    // Ascending scale: C5→E5→G5→C6 over 0.2s
    const t = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    for (let i = 0; i < notes.length; i++) {
      this._playNote(notes[i], vol * 0.2, t + i * 0.05, 0.1, 'square', channel);
    }
  }

  _synthUIClick(vol, channel) {
    // Tiny sine 800Hz
    this._playNote(800, vol * 0.08, this.ctx.currentTime, 0.02, 'sine', channel);
  }

  _synthRestart(vol, channel) {
    // Quick ascending blip: 440Hz → 880Hz
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.linearRampToValueAtTime(880, t + 0.1);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.12, t);
    gain.gain.linearRampToValueAtTime(0, t + 0.12);

    osc.connect(gain);
    gain.connect(this.uiGain);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  // --- POWER-UP SOUNDS ---

  _synthPowerUp(vol, channel) {
    // Full 5-note arpeggio: Base→x1.25→x1.5→x2.0→x2.5
    const t = this.ctx.currentTime;
    const base = 523.25 + (Math.random() - 0.5) * 20;
    const ratios = [1, 1.25, 1.5, 2.0, 2.5];
    for (let i = 0; i < ratios.length; i++) {
      this._playNote(base * ratios[i], vol * 0.18, t + i * 0.025, 0.08, 'square', channel);
    }
  }

  _synthScreenWipe(vol, channel) {
    // Dramatic sweep: 2000Hz → 100Hz + noise burst over 1.5s
    const t = this.ctx.currentTime;

    const osc = this.ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(2000, t);
    osc.frequency.linearRampToValueAtTime(100, t + 1.5);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(vol * 0.2, t);
    gain.gain.linearRampToValueAtTime(0, t + 1.6);

    const dest = channel === 'ui' ? this.uiGain : this.sfxGain;
    osc.connect(gain);
    gain.connect(dest);
    osc.start(t);
    osc.stop(t + 1.6);

    // Noise burst layer
    this._playNoise(vol * 0.12, t, 0.8, 500, 1, channel);
  }

  // ─────────────────────────────────────────────
  // CONTINUOUS SOUNDS — W2 Orbit Hum
  // ─────────────────────────────────────────────

  startOrbitHum() {
    if (this._orbitHumRunning || !this.ctx) return;
    this._orbitHumRunning = true;

    const osc1 = this.ctx.createOscillator();
    osc1.type = 'triangle';
    osc1.frequency.value = 110;

    const osc2 = this.ctx.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.value = 165; // Perfect 5th

    const gain = this.ctx.createGain();
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(0.04, this.ctx.currentTime + 0.3);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(this.sfxGain);
    osc1.start();
    osc2.start();

    this._orbitHumNode = [osc1, osc2];
    this._orbitHumGain = gain;
  }

  stopOrbitHum() {
    if (!this._orbitHumRunning || !this._orbitHumGain) return;
    this._orbitHumRunning = false;
    const t = this.ctx.currentTime;
    this._orbitHumGain.gain.linearRampToValueAtTime(0, t + 0.3);
    const nodes = this._orbitHumNode;
    setTimeout(() => {
      if (nodes) nodes.forEach(n => { try { n.stop(); n.disconnect(); } catch(e) {} });
    }, 400);
    this._orbitHumNode = null;
    this._orbitHumGain = null;
  }

  // ─────────────────────────────────────────────
  // CONTINUOUS SOUNDS — Magnet Hum
  // ─────────────────────────────────────────────

  _startMagnetHum() {
    if (this._magnetHumNode) return; // already playing
    if (!this.ctx) return;

    const osc1 = this.ctx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = 220;

    const osc2 = this.ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = 330; // Perfect 5th

    const gain = this.ctx.createGain();
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(0.06, this.ctx.currentTime + 0.3);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(this.sfxGain);
    osc1.start();
    osc2.start();

    this._magnetHumNode = [osc1, osc2];
    this._magnetHumGain = gain;
    this._magnetTimer = 10;

    // Fade out in last 0.5s, stop at 10s
    this._magnetInterval = setInterval(() => {
      this._magnetTimer -= 0.1;
      if (this._magnetTimer <= 0.5 && this._magnetHumGain) {
        this._magnetHumGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + this._magnetTimer);
      }
      if (this._magnetTimer <= 0) this._stopMagnetHum();
    }, 100);
  }

  _stopMagnetHum() {
    if (this._magnetInterval) { clearInterval(this._magnetInterval); this._magnetInterval = null; }
    if (!this._magnetHumNode) return;
    const nodes = this._magnetHumNode;
    this._magnetHumNode = null;
    this._magnetHumGain = null;
    this._magnetTimer = 0;
    setTimeout(() => {
      nodes.forEach(n => { try { n.stop(); n.disconnect(); } catch(e) {} });
    }, 50);
  }

  // ─────────────────────────────────────────────
  // DUCKING — Priority system
  // ─────────────────────────────────────────────

  _duckAll(factor, duration) {
    if (!this.sfxGain) return;
    const t = this.ctx.currentTime;
    this.sfxGain.gain.linearRampToValueAtTime(factor, t + 0.05);
    if (duration > 0) {
      setTimeout(() => {
        if (this.sfxGain) this.sfxGain.gain.linearRampToValueAtTime(0.85, this.ctx.currentTime + 0.1);
      }, duration * 1000);
    }
  }

  _duckForBoss(active) {
    if (!this.sfxGain) return;
    const t = this.ctx.currentTime;
    if (active) {
      this.sfxGain.gain.linearRampToValueAtTime(0.6, t + 0.3);
    } else {
      this.sfxGain.gain.linearRampToValueAtTime(0.85, t + 0.5);
    }
  }

  // Level-up screen duck (called from Game)
  duckForLevelUp(active) {
    if (!this.sfxGain) return;
    const t = this.ctx.currentTime;
    if (active) {
      this.sfxGain.gain.linearRampToValueAtTime(0.1, t + 0.05);
    } else {
      this.sfxGain.gain.linearRampToValueAtTime(0.85, t + 0.2);
    }
  }
}

// ============================================================
// MAIN GAME
// ============================================================

class Game {
  constructor() {
    this.canvas = document.getElementById('game-canvas');
    this.resizeCanvas();
    window.addEventListener('resize', () => this.resizeCanvas());

    // Core systems
    this.eventBus = new EventBus();
    this.dataManager = new DataManager();
    this.gameState = new GameState(this.eventBus);

    // Game systems
    this.camera = new Camera(this.canvas);
    this.inputManager = new InputManager(this.canvas, this.eventBus);
    this.inputManager._game = this;
    this.entityManager = new EntityManager();
    this.spawnSystem = new SpawnSystem(this.entityManager, this.dataManager, this.eventBus);
    this.movementSystem = new MovementSystem(this.entityManager, this.inputManager);
    this.collisionSystem = new CollisionSystem(this.entityManager, this.eventBus);
    this.weaponSystem = new WeaponSystem(this.entityManager, this.dataManager, this.eventBus);
    this.renderer = new Renderer(this.canvas, this.camera);
    this.damageSystem = new DamageSystem(this.entityManager, this.eventBus, this.renderer);
    this.pickupSystem = new PickupSystem(this.entityManager, this.dataManager, this.eventBus);
    this.levelingSystem = new LevelingSystem(this.entityManager, this.dataManager, this.eventBus);
    this.uiManager = new UIManager(this.canvas, this.eventBus);
    this.audioManager = new AudioManager(this.eventBus);
    this.floatingTextSystem = new FloatingTextSystem(this.eventBus);

    // Game loop
    this.gameLoop = new GameLoop(
      (dt) => this.update(dt),
      (interp) => this.render(interp)
    );

    this.gameTime = 0;
    this.player = null;
  }

  resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    this.canvas.width = window.innerWidth * dpr;
    this.canvas.height = window.innerHeight * dpr;
  }

  async init() {
    const loadingFill = document.getElementById('loading-fill');
    const loadingStatus = document.getElementById('loading-status');
    const loadingScreen = document.getElementById('loading-screen');

    // Load data
    await this.dataManager.loadAll((progress, status) => {
      loadingFill.style.width = `${progress * 100}%`;
      loadingStatus.textContent = status;
    });

    // Init systems
    this.damageSystem.init();
    this.pickupSystem.init();
    this.levelingSystem.init();
    this.audioManager.init();

    // Setup event listeners
    this._setupEvents();

    // Hide loading screen
    loadingScreen.style.display = 'none';

    // GAP 6 FIX: Browser audio unlock — resume AudioContext on first click
    const unlockAudio = () => {
      this.audioManager.resume();
      document.removeEventListener('click', unlockAudio);
      document.removeEventListener('touchstart', unlockAudio);
    };
    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('touchstart', unlockAudio, { once: true });

    // Start in playing state
    this.startGame();
  }

  _setupEvents() {
    this.eventBus.on('pause', (data) => {
      if (this.gameState.isPlaying()) {
        this.gameState.setState('paused');
        this.gameLoop.paused = true;
        this.inputManager._isPaused = true;
      } else if (this.gameState.isPaused()) {
        this.gameState.setState('playing');
        this.gameLoop.paused = false;
        this.inputManager._isPaused = false;
        this.audioManager.duckForLevelUp(false);
      }
    });

    this.eventBus.on('levelUp', (data) => {
      this._checkWeaponUnlocks();
      
      // Consume the queue entry that triggered this event. Without this,
      // the entry stays in the queue and selectUpgrade() sees it as a
      // still-pending level-up, opening a second upgrade screen.
      if (this.levelingSystem.hasPendingLevelUp()) {
        this.levelingSystem.consumeLevelUp();
      }
      
      this.gameState.setState('levelUp');
      this.gameLoop.paused = true;
      this.inputManager._isPaused = true;
      this.audioManager.duckForLevelUp(true);
      this._showUpgradeOptions();
    });

    this.eventBus.on('selectUpgrade', (data) => {
      if (!this.gameState.isLevelUp()) return;
      if (!this.uiManager.levelUpOptions) return;
      const index = data.index;
      if (index < 0 || index >= this.uiManager.levelUpOptions.length) return;
      const option = this.uiManager.levelUpOptions[index];
      if (option && option.apply) option.apply(this);
      this.uiManager.hideLevelUp();
      if (this.levelingSystem.hasPendingLevelUp()) {
        this.levelingSystem.consumeLevelUp();
        this._showUpgradeOptions();
      } else {
        this.gameState.setState('playing');
        this.gameLoop.paused = false;
        this.inputManager._isPaused = false;
      }
    });

    this.eventBus.on('death', (data) => {
      // GAP 5 FIX: Skip boss deaths here — handled by bossDeath event
      if (data.type === 'boss_gravekeeper') return;
      if (data.entity === this.player) {
        this.gameState.triggerGameOver('defeat', this._getStats());
        this._handleGameOver();
        this.audioManager.stopOrbitHum();
      }
    });

    this.eventBus.on('bossSpawn', (data) => {
      this.camera.shake(8, 0.5);
      this.renderer.bossEntity = data.boss;
    });

    this.eventBus.on('bossDeath', (data) => {
      this.gameState.triggerGameOver('victory', this._getStats());
      this._handleGameOver();
    });

    this.eventBus.on('pickup', (data) => {
      if (data.pickup.pickupData?.id === 'magnet') {
        this.eventBus.emit('magnetActivate', { player: data.player });
      }
      
      // Weapon Level-Up pickup: upgrade lowest-level active weapon
      if (data.pickup.pickupData?.id === 'weapon_levelup') {
        this._applyWeaponLevelUp();
      }
    });

    this.eventBus.on('restart', () => {
      this.startGame();
    });
  }

  startGame() {
    this.gameState.reset();
    this.renderer.bossEntity = null;
    this.entityManager.clearAll();
    this.spawnSystem.reset();
    this.pickupSystem.reset();
    this.levelingSystem.reset();
    this.weaponSystem.reset();
    this.gameTime = 0;

    // Create player
    const charData = this.dataManager.characters;
    this.player = this.entityManager.create('player', {
      x: 0,
      y: 0,
      hp: charData.stats.maxHealth,
      maxHp: charData.stats.maxHealth,
      speed: charData.stats.moveSpeed,
      stats: charData.stats,
      size: charData.hitbox.width / 2,
      visual: charData.visual,
      damageMultiplier: 1,
    });

    this.weaponSystem.init(this.player);
    // GAP 4 FIX: Pass player reference to AudioManager for distance calculations
    this.audioManager.setPlayer(this.player);
    this.gameState.setState('playing');
    this.gameLoop.paused = false;
    this.gameLoop.start();
  }

  update(dt) {
    if (!this.gameState.isPlaying()) return;
    // Guard: prevent updates after game over
    if (this.gameState.isGameOver()) return;

    this.gameTime += dt;

    // Run all systems in order
    this.movementSystem.update(dt);
    this.weaponSystem.update(dt);
    this.collisionSystem.update();
    this.damageSystem.update(dt);
    this.entityManager.cleanup();
    this.spawnSystem.update(dt);
    this.pickupSystem.update(dt);
    this.levelingSystem.update(dt);

    // GAP 2+3 FIX: Detect boss state transitions for audio events
    this._detectBossStateChanges();

    // Update camera
    if (this.player) {
      this.camera.follow(this.player);
    }
    this.camera.update(dt);

    // Check game over conditions
    if (this.gameTime >= 300) {
      this.gameState.triggerGameOver('survived', this._getStats());
      this._handleGameOver();
    }
  }

  _applyWeaponLevelUp() {
    const weaponIds = ['w1_projectile', 'w2_orbit', 'w3_area'];
    // Find the lowest-level active weapon (prioritize upgrading what's unlocked)
    let bestWeapon = null;
    let bestLevel = Infinity;
    for (const wid of weaponIds) {
      const level = this.weaponSystem.weaponLevels[wid] || 0;
      if (level > 0 && level < bestLevel) {
        bestLevel = level;
        bestWeapon = wid;
      }
    }
    if (bestWeapon) {
      this.weaponSystem.levelUp(bestWeapon);
    }
  }

  // GAP 2+3 FIX: Detect boss state transitions and emit events for AudioManager
  _detectBossStateChanges() {
    if (!this.renderer.bossEntity) return;
    const boss = this.renderer.bossEntity;
    if (!boss || boss.hp <= 0) return;
    
    const prevState = boss._prevAudioState || '';
    const currState = boss._bossState || '';
    
    if (prevState !== currState) {
      boss._prevAudioState = currState;
      
      // Windup = telegraph before charge — play warning growl
      if (currState === 'windup') {
        this.eventBus.emit('bossCharge', { boss, phase: 'windup' });
      }
      // Charge = actual rush — play impact sound
      if (currState === 'charge') {
        this.eventBus.emit('bossCharge', { boss, phase: 'charge' });
      }
    }
  }

  _handleGameOver() {
    // Pause the game loop
    this.gameLoop.paused = true;
    this.inputManager._isPaused = true;
    // Show end screen with result and stats
    const result = this.gameState.endResult || 'defeat';
    const stats = this.gameState.endStats || this._getStats();
    this.uiManager.showEndScreen(result, stats);
  }

  render(interp) {
    const entities = this.entityManager.getActive();
    this.renderer.render(entities, this.player);

    // Update renderer UI data
    if (this.player) {
      this.renderer.level = this.levelingSystem.level;
      this.renderer.xpPercent = this.levelingSystem.xp / this.levelingSystem._getXpToNext(this.levelingSystem.level);
    }

    // Floating damage/pickup text
    this.floatingTextSystem.update(1/60);
    const ctx = this.renderer.ctx;
    ctx.save();
    this.camera.apply(ctx);
    this.floatingTextSystem.draw(ctx);
    ctx.restore();

    // Always render UI (includes end screen overlay when game over)
    this.uiManager.render();
  }

  _checkWeaponUnlocks() {
    const level = this.levelingSystem.level;
    const weapons = this.dataManager.weapons;
    console.log(`[WeaponUnlock] Checking at level ${level}, weapons count: ${weapons ? weapons.length : 'null'}`);
    if (!weapons || !Array.isArray(weapons)) {
      console.error('[WeaponUnlock] weapons is not an array:', weapons);
      return;
    }
    for (const weapon of weapons) {
      console.log(`[WeaponUnlock] ${weapon.id}: unlockLevel=${weapon.unlockLevel}, currentLevel=${this.weaponSystem.weaponLevels[weapon.id] || 0}`);
      if (weapon.unlockLevel && level >= weapon.unlockLevel) {
        if (!this.weaponSystem.weaponLevels[weapon.id]) {
          console.log(`[WeaponUnlock] UNLOCKING ${weapon.id}!`);
          this.weaponSystem.unlockWeapon(weapon.id);
          this.eventBus.emit('weaponUnlock', { weaponId: weapon.id, name: weapon.name });
        }
      }
    }
  }

  _showUpgradeOptions() {
    if (this.gameState.isLevelUp() && this.uiManager.levelUpOptions) return;
  
    // Build upgrade pool: stat upgrades + weapon upgrades for active weapons
    const upgrades = [
      {
        name: 'Damage Up',
        desc: '+15% base damage',
        apply: (game) => {
          if (game.player) {
            if (!game.player.damageMultiplier) game.player.damageMultiplier = 1;
            game.player.damageMultiplier *= 1.15;
          }
        },
      },
      {
        name: 'Speed Up',
        desc: '+10% move speed',
        apply: (game) => {
          if (game.player) {
            if (!game.player.speedMultiplier) game.player.speedMultiplier = 1;
            game.player.speedMultiplier *= 1.10;
            game.player.speed = (game.player.stats?.moveSpeed || 200) * game.player.speedMultiplier;
          }
        },
      },
      {
        name: 'Health Up',
        desc: '+20 max HP & heal',
        apply: (game) => {
          if (game.player) {
            game.player.maxHp += 20;
            game.player.hp = Math.min(game.player.hp + 20, game.player.maxHp);
          }
        },
      },
    ];

    // Add weapon upgrades for each unlocked weapon (max level 7)
    const weaponIds = ['w1_projectile', 'w2_orbit', 'w3_area'];
    const weaponNames = { w1_projectile: 'Projectile', w2_orbit: 'Orbit', w3_area: 'Area' };
    for (const wid of weaponIds) {
      const wLevel = game.weaponSystem.weaponLevels[wid] || 0;
      if (wLevel > 0 && wLevel < 7) {
        const wData = game.dataManager.weapons.find(w => w.id === wid);
        const nextStats = wData?.statsPerLevel?.[wLevel]; // next level's stats
        const desc = nextStats ? `Lv ${wLevel} → ${wLevel + 1}` : `Upgrade ${weaponNames[wid]}`;
        upgrades.push({
          name: `${weaponNames[wid]} Up`,
          desc: desc,
          apply: (game) => {
            game.weaponSystem.levelUp(wid);
          },
        });
      }
    }

    // Shuffle and pick 3
    for (let i = upgrades.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [upgrades[i], upgrades[j]] = [upgrades[j], upgrades[i]];
    }
    this.uiManager.showLevelUp(upgrades.slice(0, 3));
  }

  _getStats() {
    return {
      time: `${Math.floor(this.gameTime / 60)}:${String(Math.floor(this.gameTime % 60)).padStart(2, '0')}`,
      level: this.levelingSystem.level,
      kills: this.entityManager.getCount('enemy'),
      gold: 0,
    };
  }
}

// ============================================================
// START
// ============================================================

const game = new Game();
game.init().catch(console.error);

</script>
