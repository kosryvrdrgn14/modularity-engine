<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A1A"/>
      <stop offset="35%" stop-color="#1A1A3E"/>
      <stop offset="65%" stop-color="#2D1B4E"/>
      <stop offset="85%" stop-color="#5C2D3A"/>
      <stop offset="100%" stop-color="#D4764A"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8D5B7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8D5B7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="120" cy="70" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="200" cy="25" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="280" cy="55" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="350" cy="35" r="1.3" fill="#fff" opacity="0.8"/>
  <circle cx="420" cy="65" r="0.9" fill="#fff" opacity="0.5"/>
  <circle cx="500" cy="30" r="1.4" fill="#fff" opacity="0.85"/>
  <circle cx="560" cy="50" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="620" cy="20" r="1.2" fill="#fff" opacity="0.75"/>
  <circle cx="700" cy="45" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="750" cy="60" r="1.1" fill="#fff" opacity="0.65"/>
  <circle cx="160" cy="90" r="0.7" fill="#fff" opacity="0.4"/>
  <circle cx="440" cy="80" r="0.9" fill="#fff" opacity="0.5"/>
  <circle cx="680" cy="75" r="0.8" fill="#fff" opacity="0.45"/>
  <circle cx="90" cy="55" r="1.6" fill="#fff" opacity="1"/>
  <circle cx="310" cy="15" r="1.6" fill="#fff" opacity="1"/>
  <circle cx="580" cy="40" r="1.6" fill="#fff" opacity="1"/>

  <!-- Moon -->
  <circle cx="680" cy="80" r="40" fill="url(#moonGlow)"/>
  <circle cx="680" cy="80" r="18" fill="#E8D5B7" opacity="0.85"/>
  <circle cx="688" cy="74" r="16" fill="#1A1A3E"/>

  <!-- Distant hills -->
  <path d="M0 340 Q100 310 200 330 Q300 300 400 320 Q500 295 600 315 Q700 300 800 325 L800 380 L0 380 Z" fill="#12101E" opacity="0.6"/>

  <!-- Buildings silhouette -->
  <!-- Far left: small house -->
  <path d="M40 380 L40 340 L55 320 L70 340 L70 380 Z" fill="#0D0D1A"/>
  <rect x="50" y="355" width="4" height="4" fill="#FF9100" opacity="0.7"/>

  <!-- Tall tower -->
  <rect x="90" y="290" width="30" height="90" fill="#0D0D1A"/>
  <path d="M85 290 L105 260 L125 290 Z" fill="#0D0D1A"/>
  <rect x="99" y="310" width="4" height="5" fill="#FF9100" opacity="0.7"/>
  <rect x="107" y="325" width="4" height="5" fill="#FF9100" opacity="0.6"/>

  <!-- Medium house -->
  <path d="M140 380 L140 340 L165 315 L190 340 L190 380 Z" fill="#0D0D1A"/>
  <rect x="158" y="350" width="4" height="4" fill="#FF9100" opacity="0.7"/>
  <rect x="168" y="350" width="4" height="4" fill="#FF9100" opacity="0.6"/>

  <!-- Church with steeple -->
  <rect x="220" y="280" width="40" height="100" fill="#0D0D1A"/>
  <path d="M215 280 L240 230 L265 280 Z" fill="#0D0D1A"/>
  <rect x="236" y="226" width="8" height="8" fill="#0D0D1A"/>
  <line x1="240" y1="220" x2="240" y2="228" stroke="#0D0D1A" stroke-width="2"/>
  <rect x="232" y="300" width="5" height="8" fill="#FF9100" opacity="0.5"/>
  <rect x="243" y="300" width="5" height="8" fill="#FF9100" opacity="0.6"/>
  <rect x="232" y="325" width="5" height="5" fill="#FF9100" opacity="0.7"/>
  <rect x="243" y="325" width="5" height="5" fill="#FF9100" opacity="0.7"/>

  <!-- Large building -->
  <path d="M290 380 L290 330 L330 310 L370 330 L370 380 Z" fill="#0D0D1A"/>
  <rect x="305" y="345" width="4" height="5" fill="#FF9100" opacity="0.6"/>
  <rect x="315" y="345" width="4" height="5" fill="#FF9100" opacity="0.7"/>
  <rect x="325" y="345" width="4" height="5" fill="#FF9100" opacity="0.6"/>
  <rect x="345" y="345" width="4" height="5" fill="#FF9100" opacity="0.7"/>

  <!-- Shop (wide, flat roof) -->
  <rect x="385" y="345" width="70" height="35" fill="#0D0D1A"/>
  <rect x="380" y="340" width="80" height="8" fill="#0D0D1A"/>
  <rect x="400" y="355" width="5" height="5" fill="#FF9100" opacity="0.7"/>
  <rect x="415" y="355" width="5" height="5" fill="#FF9100" opacity="0.6"/>
  <rect x="430" y="355" width="5" height="5" fill="#FF9100" opacity="0.7"/>

  <!-- Tall narrow house -->
  <path d="M475 380 L475 310 L497 285 L520 310 L520 380 Z" fill="#0D0D1A"/>
  <rect x="492" y="320" width="4" height="5" fill="#FF9100" opacity="0.7"/>
  <rect x="492" y="345" width="4" height="5" fill="#FF9100" opacity="0.6"/>

  <!-- Windmill -->
  <rect x="545" y="300" width="30" height="80" fill="#0D0D1A"/>
  <path d="M540 300 L560 270 L580 300 Z" fill="#0D0D1A"/>
  <line x1="560" y1="295" x2="560" y2="275" stroke="#0D0D1A" stroke-width="2"/>
  <line x1="560" y1="295" x2="545" y2="282" stroke="#0D0D1A" stroke-width="2"/>
  <line x1="560" y1="295" x2="575" y2="282" stroke="#0D0D1A" stroke-width="2"/>
  <line x1="560" y1="295" x2="560" y2="310" stroke="#0D0D1A" stroke-width="2"/>
  <rect x="555" y="330" width="4" height="4" fill="#FF9100" opacity="0.7"/>

  <!-- Two-story house -->
  <path d="M610 380 L610 320 L640 300 L670 320 L670 380 Z" fill="#0D0D1A"/>
  <rect x="625" y="335" width="4" height="4" fill="#FF9100" opacity="0.7"/>
  <rect x="645" y="335" width="4" height="4" fill="#FF9100" opacity="0.6"/>
  <rect x="625" y="355" width="4" height="4" fill="#FF9100" opacity="0.6"/>
  <rect x="645" y="355" width="4" height="4" fill="#FF9100" opacity="0.7"/>

  <!-- Cottage with chimney -->
  <path d="M700 380 L700 345 L740 325 L780 345 L780 380 Z" fill="#0D0D1A"/>
  <rect x="745" y="325" width="8" height="20" fill="#0D0D1A"/>
  <rect x="720" y="355" width="4" height="4" fill="#FF9100" opacity="0.7"/>
  <rect x="750" y="355" width="4" height="4" fill="#FF9100" opacity="0.6"/>

  <!-- Ground -->
  <path d="M0 380 Q50 377 100 379 Q150 376 200 378 Q250 375 300 377 Q350 374 400 376 Q450 373 500 375 Q550 372 600 374 Q650 371 700 373 Q750 370 800 372 L800 450 L0 450 Z" fill="#0D0D1A"/>

  <!-- Floating embers / fireflies -->
  <circle class="ember" cx="150" cy="360" r="1.5" fill="#FFB74D" opacity="0.7">
    <animate attributeName="cy" values="360;320;280" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.4;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="150;155;148" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle class="ember" cx="320" cy="370" r="1.2" fill="#FFB74D" opacity="0.6">
    <animate attributeName="cy" values="370;335;300" dur="9s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.6;0.3;0" dur="9s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="cx" values="320;315;322" dur="7s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle class="ember" cx="480" cy="365" r="1.8" fill="#FFB74D" opacity="0.8">
    <animate attributeName="cy" values="365;325;285" dur="7s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0.8;0.4;0" dur="7s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cx" values="480;485;478" dur="5s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle class="ember" cx="600" cy="358" r="1.3" fill="#FFB74D" opacity="0.65">
    <animate attributeName="cy" values="358;318;278" dur="10s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="opacity" values="0.65;0.35;0" dur="10s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="cx" values="600;595;603" dur="8s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <circle class="ember" cx="250" cy="375" r="1" fill="#FFB74D" opacity="0.5">
    <animate attributeName="cy" values="375;340;305" dur="11s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="opacity" values="0.5;0.25;0" dur="11s" repeatCount="indefinite" begin="4s"/>
  </circle>
  <circle class="ember" cx="700" cy="362" r="1.4" fill="#FFB74D" opacity="0.7">
    <animate attributeName="cy" values="362;322;282" dur="8.5s" repeatCount="indefinite" begin="5s"/>
    <animate attributeName="opacity" values="0.7;0.35;0" dur="8.5s" repeatCount="indefinite" begin="5s"/>
    <animate attributeName="cx" values="700;705;698" dur="6s" repeatCount="indefinite" begin="5s"/>
  </circle>
</svg>
