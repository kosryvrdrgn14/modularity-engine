<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26">
  <!-- Cloak spread -->
  <ellipse cx="13" cy="14" rx="10" ry="9" fill="#1B4F72"/>
  <!-- Inner robe -->
  <ellipse cx="13" cy="13" rx="7" ry="7" fill="#2E86C1"/>
  <!-- Robe highlight -->
  <ellipse cx="13" cy="11" rx="5" ry="4" fill="#3498DB" opacity="0.4"/>
  <!-- Hood -->
  <path d="M8 10 Q13 2 18 10" fill="#1B4F72"/>
  <path d="M9 10 Q13 4 17 10" fill="#2E86C1"/>
  <!-- Face shadow -->
  <ellipse cx="13" cy="9" rx="3" ry="2" fill="#0E2A3D"/>
  <!-- Eyes -->
  <circle cx="11.5" cy="9" r="0.8" fill="#AED6F1"/>
  <circle cx="14.5" cy="9" r="0.8" fill="#AED6F1"/>
  <!-- Staff -->
  <rect x="20" y="4" width="2" height="18" rx="1" fill="#5D4E37"/>
  <rect x="20.5" y="4" width="1" height="16" fill="#8B7355" opacity="0.3"/>
  <!-- Staff top orb -->
  <circle cx="21" cy="4" r="3" fill="#0288D1" opacity="0.5"/>
  <circle cx="21" cy="4" r="2" fill="#29B6F6"/>
  <circle cx="21" cy="3.5" r="1" fill="#E1F5FE"/>
  <!-- Magic glow lines -->
  <line x1="21" y1="4" x2="18" y2="8" stroke="#AED6F1" stroke-width="0.5" opacity="0.4"/>
  <line x1="21" y1="4" x2="24" y2="8" stroke="#AED6F1" stroke-width="0.5" opacity="0.4"/>
  <line x1="21" y1="4" x2="21" y2="9" stroke="#AED6F1" stroke-width="0.5" opacity="0.4"/>
</svg>
