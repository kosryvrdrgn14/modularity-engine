<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark aura background -->
  <circle cx="16" cy="16" r="15" fill="#1A0A2A" opacity="0.4"/>
  <!-- Robe (flowing, dark purple) -->
  <path d="M10 14 Q8 20 6 28 L26 28 Q24 20 22 14 Z" fill="#2A1A3A"/>
  <path d="M10 14 Q8 20 6 28 L16 28 L16 14 Z" fill="#3A2A4A"/>
  <!-- Robe trim -->
  <path d="M6 28 Q16 26 26 28" fill="none" stroke="#6A3A8A" stroke-width="0.8"/>
  <!-- Inner robe detail -->
  <path d="M14 16 L12 24" fill="none" stroke="#4A3A5A" stroke-width="0.5"/>
  <path d="M18 16 L20 24" fill="none" stroke="#4A3A5A" stroke-width="0.5"/>
  <!-- Body/torso -->
  <rect x="12" y="12" width="8" height="6" rx="2" fill="#E8C8A8"/>
  <!-- Collar/bodice -->
  <path d="M12 14 Q16 12 20 14" fill="#2A1A3A"/>
  <!-- Arms -->
  <path d="M12 14 Q8 16 7 18" fill="none" stroke="#E8C8A8" stroke-width="2" stroke-linecap="round"/>
  <path d="M20 14 Q24 16 25 18" fill="none" stroke="#E8C8A8" stroke-width="2" stroke-linecap="round"/>
  <!-- Hands -->
  <circle cx="7" cy="18" r="1.2" fill="#E8C8A8"/>
  <circle cx="25" cy="18" r="1.2" fill="#E8C8A8"/>
  <!-- Staff (left hand) -->
  <rect x="5" y="8" width="1.5" height="20" rx="0.5" fill="#4A3A2A"/>
  <!-- Staff orb -->
  <circle cx="5.75" cy="7" r="2.5" fill="#8A4AAA"/>
  <circle cx="5.75" cy="7" r="1.8" fill="#AA6ACC"/>
  <circle cx="5.75" cy="6.5" r="0.8" fill="#CCAADD"/>
  <!-- Orb glow -->
  <circle cx="5.75" cy="7" r="3.5" fill="#AA6ACC" opacity="0.2"/>
  <!-- Head -->
  <circle cx="16" cy="9" r="4.5" fill="#F5D0B0"/>
  <!-- Hair (long, dark purple, flowing) -->
  <path d="M11 7 Q13 3 16 3 Q19 3 21 7 Q22 10 21 14 L22 20" fill="#3A1A4A"/>
  <path d="M21 7 Q22 10 21 14 L22 20" fill="#3A1A4A"/>
  <path d="M11 7 Q10 10 11 14 L10 20" fill="#3A1A4A"/>
  <!-- Hair bangs -->
  <path d="M12 6 Q14 4 16 5 Q18 4 20 6" fill="#4A2A5A"/>
  <!-- Hair shine -->
  <path d="M14 4 Q16 3.5 18 4" fill="none" stroke="#6A4A7A" stroke-width="0.5" opacity="0.5"/>
  <!-- Eyes (big, cute, glowing purple) -->
  <ellipse cx="14" cy="9" rx="1.8" ry="1.5" fill="#FFF"/>
  <circle cx="14" cy="9" r="1.2" fill="#8A4AAA"/>
  <circle cx="14" cy="8.8" r="0.6" fill="#4A1A6A"/>
  <circle cx="13.5" cy="8.5" r="0.3" fill="#FFF" opacity="0.8"/>
  <ellipse cx="18" cy="9" rx="1.8" ry="1.5" fill="#FFF"/>
  <circle cx="18" cy="9" r="1.2" fill="#8A4AAA"/>
  <circle cx="18" cy="8.8" r="0.6" fill="#4A1A6A"/>
  <circle cx="17.5" cy="8.5" r="0.3" fill="#FFF" opacity="0.8"/>
  <!-- Eyelashes -->
  <path d="M12 8 Q13 7.5 14 8" fill="none" stroke="#2A1A0A" stroke-width="0.5"/>
  <path d="M18 8 Q19 7.5 20 8" fill="none" stroke="#2A1A0A" stroke-width="0.5"/>
  <!-- Eyebrows (thin, arched) -->
  <path d="M12.5 7.5 Q14 7 15.5 7.5" fill="none" stroke="#3A1A4A" stroke-width="0.5"/>
  <path d="M16.5 7.5 Q18 7 19.5 7.5" fill="none" stroke="#3A1A4A" stroke-width="0.5"/>
  <!-- Blush -->
  <ellipse cx="12.5" cy="10" rx="1.2" ry="0.6" fill="#FFB0A0" opacity="0.3"/>
  <ellipse cx="19.5" cy="10" rx="1.2" ry="0.6" fill="#FFB0A0" opacity="0.3"/>
  <!-- Nose (small) -->
  <path d="M15.5 9.5 Q16 10 16.5 9.5" fill="none" stroke="#D4A080" stroke-width="0.4"/>
  <!-- Mouth (cute smile) -->
  <path d="M14 11 Q16 12.5 18 11" fill="none" stroke="#CC7766" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Crown/horns -->
  <path d="M13 5 L12 2 L14 4" fill="#6A3A8A"/>
  <path d="M16 4.5 L16 1.5 L17 4" fill="#8A4AAA"/>
  <path d="M19 5 L20 2 L18 4" fill="#6A3A8A"/>
  <!-- Magic particles -->
  <circle cx="4" cy="12" r="0.5" fill="#AA6ACC" opacity="0.6"/>
  <circle cx="28" cy="10" r="0.4" fill="#AA6ACC" opacity="0.5"/>
  <circle cx="3" cy="16" r="0.3" fill="#CC8AEE" opacity="0.4"/>
  <circle cx="29" cy="14" r="0.3" fill="#CC8AEE" opacity="0.4"/>
  <!-- Skeleton minions (tiny, at feet) -->
  <circle cx="8" cy="26" r="1" fill="#8A8A7A"/>
  <circle cx="24" cy="26" r="1" fill="#8A8A7A"/>
  <circle cx="8" cy="25.5" r="0.3" fill="#FF4444"/>
  <circle cx="24" cy="25.5" r="0.3" fill="#FF4444"/>
</svg>