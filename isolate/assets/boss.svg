<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <!-- Dark aura -->
  <circle cx="28" cy="28" r="27" fill="#1A0000" opacity="0.3"/>
  <!-- Massive shoulders/armor -->
  <rect x="4" y="16" width="18" height="22" rx="3" fill="#4A0000"/>
  <rect x="34" y="16" width="18" height="22" rx="3" fill="#4A0000"/>
  <!-- Shoulder armor plates -->
  <rect x="6" y="18" width="14" height="8" rx="2" fill="#3A0000"/>
  <rect x="36" y="18" width="14" height="8" rx="2" fill="#3A0000"/>
  <rect x="8" y="19" width="10" height="6" rx="1" fill="#5A1010" opacity="0.6"/>
  <rect x="38" y="19" width="10" height="6" rx="1" fill="#5A1010" opacity="0.6"/>
  <!-- Body core -->
  <rect x="16" y="14" width="24" height="28" rx="4" fill="#4A0000"/>
  <!-- Chest plate -->
  <rect x="20" y="18" width="16" height="16" rx="2" fill="#3A0000"/>
  <!-- Rune cracks on chest -->
  <line x1="24" y1="20" x2="28" y2="30" stroke="#FF1744" stroke-width="0.8" opacity="0.6"/>
  <line x1="32" y1="22" x2="28" y2="32" stroke="#FF1744" stroke-width="0.8" opacity="0.6"/>
  <line x1="22" y1="28" x2="34" y2="28" stroke="#FF1744" stroke-width="0.5" opacity="0.4"/>
  <!-- Skull/death mask -->
  <circle cx="28" cy="10" r="7" fill="#3A0000"/>
  <circle cx="28" cy="10" r="6" fill="#2A0000"/>
  <!-- Crown/horns -->
  <polygon points="22,6 20,1 24,5" fill="#4A0000"/>
  <polygon points="34,6 36,1 32,5" fill="#4A0000"/>
  <polygon points="28,4 28,0 30,4" fill="#5A1010"/>
  <!-- Eye sockets -->
  <ellipse cx="25" cy="9" rx="2.5" ry="2" fill="#1A0000"/>
  <ellipse cx="31" cy="9" rx="2.5" ry="2" fill="#1A0000"/>
  <!-- Glowing red eyes -->
  <circle cx="25" cy="9" r="1.5" fill="#FF1744"/>
  <circle cx="31" cy="9" r="1.5" fill="#FF1744"/>
  <circle cx="25" cy="8.5" r="0.6" fill="#FF8A80"/>
  <circle cx="31" cy="8.5" r="0.6" fill="#FF8A80"/>
  <!-- Jaw/mouth -->
  <path d="M23 13 Q28 17 33 13" fill="none" stroke="#1A0000" stroke-width="1.5"/>
  <!-- Scythe blade -->
  <path d="M44 4 Q52 10 48 20 L46 18 Q48 12 44 8 Z" fill="#5A1010"/>
  <path d="M44 4 Q50 9 47 17 L46 16 Q48 11 44 7 Z" fill="#7A2020" opacity="0.5"/>
  <!-- Scythe handle -->
  <rect x="42" y="16" width="2.5" height="22" rx="1" fill="#3A0000"/>
  <rect x="42.5" y="16" width="1.5" height="20" fill="#5A1010" opacity="0.4"/>
  <!-- Bottom armor plates -->
  <rect x="18" y="40" width="8" height="10" rx="2" fill="#3A0000"/>
  <rect x="30" y="40" width="8" height="10" rx="2" fill="#3A0000"/>
</svg>
