" fill="#FFF" opacity="0.7"/>    <!-- Eyebrows (bushy, gray) -->   <path d="M42 46 Q48 43 54 46" fill="none" stroke="#AAAAAA" stroke-width="2" stroke-linecap="round"/>   <path d="M66 46 Q72 43 78 46" fill="none" stroke="#AAAAAA" stroke-width="2" stroke-linecap="round"/>    <!-- Nose -->   <path d="M58 55 Q60 62 62 55" fill="none" stroke="#B08050" stroke-width="1.5" stroke-linecap="round"/>    <!-- Mouth (slight smile) -->   <path d="M50 68 Q60 74 70 68" fill="none" stroke="#8B5E3C" stroke-width="1.5" stroke-linecap="round"/>    <!-- Beard (short, gray) -->   <path d="M42 72 Q45 80 50 82" fill="none" stroke="#BBBBBB" stroke-width="1.5" opacity="0.7"/>   <path d="M48 74 Q50 82 52 84" fill="none" stroke="#BBBBBB" stroke-width="1" opacity="0.6"/>   <path d="M55 76 Q58 84 60 85" fill="none" stroke="#BBBBBB" stroke-width="1" opacity="0.5"/>   <path d="M65 76 Q62 84 60 85" fill="none" stroke="#BBBBBB" stroke-width="1" opacity="0.5"/>   <path d="M72 74 Q70 82 68 84" fill="none" stroke="#BBBBBB" stroke-width="1" opacity="0.6"/>   <path d="M78 72 Q75 80 70 82" fill="none" stroke="#BBBBBB" stroke-width="1.5" opacity="0.7"/>    <!-- Scar on forehead -->   <line x1="52" y1="38" x2="58" y2="42" stroke="#B08050" stroke-width="0.8" opacity="0.5"/> </svg>