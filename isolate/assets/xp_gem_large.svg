<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- Gem body -->
  <polygon points="14,2 25,14 14,26 3,14" fill="#81D4FA"/>
  <!-- Facet lines -->
  <line x1="14" y1="2" x2="14" y2="26" stroke="#29B6F6" stroke-width="0.8" opacity="0.5"/>
  <line x1="3" y1="14" x2="25" y2="14" stroke="#29B6F6" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="2" x2="3" y2="14" stroke="#4FC3F7" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="2" x2="25" y2="14" stroke="#4FC3F7" stroke-width="0.5" opacity="0.4"/>
  <line x1="14" y1="26" x2="3" y2="14" stroke="#0288D1" stroke-width="0.5" opacity="0.3"/>
  <line x1="14" y1="26" x2="25" y2="14" stroke="#0288D1" stroke-width="0.5" opacity="0.3"/>
  <!-- Highlight facets -->
  <polygon points="14,2 25,14 14,14" fill="#B3E5FC" opacity="0.35"/>
  <polygon points="14,2 3,14 14,14" fill="#E1F5FE" opacity="0.25"/>
  <!-- Sparkle -->
  <circle cx="18" cy="6" r="1.5" fill="#E1F5FE"/>
  <circle cx="18" cy="6" r="0.6" fill="#FFFFFF"/>
  <circle cx="10" cy="10" r="0.8" fill="#E1F5FE" opacity="0.6"/>
</svg>
