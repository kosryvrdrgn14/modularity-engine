<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Gem diamond shape -->
  <polygon points="8,1 14,8 8,15 2,8" fill="#4FC3F7"/>
  <!-- Facet lines -->
  <line x1="8" y1="1" x2="8" y2="15" stroke="#29B6F6" stroke-width="0.5" opacity="0.6"/>
  <line x1="2" y1="8" x2="14" y2="8" stroke="#29B6F6" stroke-width="0.5" opacity="0.6"/>
  <!-- Highlight facets -->
  <polygon points="8,1 14,8 8,8" fill="#B3E5FC" opacity="0.4"/>
  <!-- Sparkle -->
  <circle cx="10" cy="4" r="1" fill="#E1F5FE"/>
  <circle cx="10" cy="4" r="0.4" fill="#FFFFFF"/>
</svg>
