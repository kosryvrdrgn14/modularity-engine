<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
  <!-- Healing aura -->
  <circle cx="7" cy="7" r="6.5" fill="#4FC3F7" opacity="0.15"/>
  <!-- Robe (white/light blue) -->
  <path d="M4 8 Q3 10 2 13 L12 13 Q11 10 10 8 Z" fill="#E8F4FD"/>
  <!-- Robe trim -->
  <path d="M2 13 Q7 12 12 13" fill="none" stroke="#4FC3F7" stroke-width="0.4"/>
  <!-- Body -->
  <rect x="5" y="7" width="4" height="3" rx="1" fill="#F5D0B0"/>
  <!-- Head -->
  <circle cx="7" cy="5" r="2.5" fill="#F5D0B0"/>
  <!-- Hair (light blue/white) -->
  <path d="M4.5 4 Q5.5 2 7 2 Q8.5 2 9.5 4 Q9 3 8 2.8 Q7 2.5 6 2.8 Q5 3 4.5 4" fill="#B0D4F1"/>
  <!-- Hair sides -->
  <path d="M4.5 4 Q4 5.5 4.5 7" fill="none" stroke="#B0D4F1" stroke-width="0.8"/>
  <path d="M9.5 4 Q10 5.5 9.5 7" fill="none" stroke="#B0D4F1" stroke-width="0.8"/>
  <!-- Eyes (kind, blue) -->
  <circle cx="6" cy="5" r="0.7" fill="#FFF"/>
  <circle cx="6" cy="5" r="0.4" fill="#4FC3F7"/>
  <circle cx="8" cy="5" r="0.7" fill="#FFF"/>
  <circle cx="8" cy="5" r="0.4" fill="#4FC3F7"/>
  <!-- Smile -->
  <path d="M6 6 Q7 6.5 8 6" fill="none" stroke="#CC7766" stroke-width="0.3"/>
  <!-- Staff (left side) -->
  <rect x="2" y="4" width="0.6" height="8" rx="0.2" fill="#8B6914"/>
  <!-- Staff orb (healing) -->
  <circle cx="2.3" cy="3.5" r="1" fill="#4FC3F7"/>
  <circle cx="2.3" cy="3.5" r="0.6" fill="#81D4FA"/>
  <!-- Cross symbol on robe -->
  <line x1="7" y1="9" x2="7" y2="11" stroke="#4FC3F7" stroke-width="0.5"/>
  <line x1="6" y1="10" x2="8" y2="10" stroke="#4FC3F7" stroke-width="0.5"/>
</svg>